<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대진표 오버레이</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>

:root{
  --bg:#0b0f14;
  --panel:#131a22;
  --panel2:#18212b;
  --line:#293747;

  --gold:#f0a93f;
  --gold2:#ffc15e;

  --text:#e7edf3;
  --sub:#8a97a6;

  --race-p:#FFE000;
  --race-t:#00AFFF;
  --race-z:#FF4545;
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  background:transparent;
  color:var(--text);
  font-family:'Pretendard', sans-serif;
}

body{
  padding:20px;
}

.title-wrap{
  text-align:center;
  margin-bottom:18px;
}

.title{
  display:inline-block;
  font-size:16px;
  font-weight:800;
  letter-spacing:.18em;
  color:var(--gold);
  border:2px solid var(--gold);
  padding:6px 22px;
  clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
}

.subtitle{
  margin-top:8px;
  font-size:11px;
  letter-spacing:.08em;
  color:var(--sub);
}

.grid{
  display:grid;
  gap:8px;
}

.col{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.col-label{
  text-align:center;
  color:var(--sub);
  font-size:12px;
  font-weight:700;
}

.slot{
  background:var(--panel);
  border:1px solid var(--line);
  clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  padding:8px 6px;
  text-align:center;
  min-height:78px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transition:.2s;
}

.slot.empty{ opacity:.28; }

.slot.winner{
  border-color:var(--gold);
  background:rgba(240,169,63,.10);
}

/* 팀전에서 선수가 여럿일 때 */
.player-stack{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
}

.player-photo-row{
  display:flex;
  gap:2px;
  margin-bottom:4px;
}

.player-photo{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--line);
  background:#1a232d;
}

.slot.winner .player-photo{
  border-color:var(--gold);
}

.player-name{
  font-size:12px;
  font-weight:700;
  max-width:120px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.player-race{
  font-size:9px;
  font-weight:800;
  margin-top:1px;
}

.race-P{ color:var(--race-p); }
.race-T{ color:var(--race-t); }
.race-Z{ color:var(--race-z); }

.map-img{
  width:100%;
  height:28px;
  object-fit:cover;
  border-radius:2px;
  margin-bottom:4px;
  background:#1a232d;
}

.map-name{
  font-size:10px;
  color:var(--sub);
  border-top:1px solid var(--line);
  padding-top:3px;
  width:100%;
}

.placeholder{
  text-align:center;
  color:var(--sub);
  font-size:13px;
  padding:40px 0;
}

</style>
</head>

<body>

<div class="title-wrap">
  <div class="title">대진표</div>
  <div class="subtitle" id="subtitle"></div>
</div>

<div id="content">
  <div class="placeholder">대진표 준비중</div>
</div>

<script type="module">

import { ref, onValue, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
import { db } from "./firebase-config.js";

const IMAGE_BASE_PLAYER = "https://raw.githubusercontent.com/ChzzkHarm0ny/SZD/refs/heads/main/images/";
const IMAGE_BASE_MAP = "https://raw.githubusercontent.com/ChzzkHarm0ny/SZD/refs/heads/main/maps/";

const params = new URLSearchParams(location.search);
const roomId = params.get('room');

const contentEl = document.getElementById('content');
const subtitleEl = document.getElementById('subtitle');

let playerMap = {};
let mapMap = {};

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function playerImageUrl(name){
  const known = playerMap[name];
  if (known && known.img) return known.img;
  if (!name || name === '미정' || name === '-') return '';
  return IMAGE_BASE_PLAYER + encodeURIComponent(name) + '.png';
}

function mapImageUrl(name){
  const known = mapMap[name];
  if (known && known.url) return known.url;
  if (!name || name === '미정' || name === '-') return '';
  return IMAGE_BASE_MAP + encodeURIComponent(name) + '.png';
}

function playerRaceClass(name){
  const known = playerMap[name];
  if (!known || !known.race) return '';
  const race = String(known.race);
  if (race.includes('토스') || race === 'P') return 'race-P';
  if (race.includes('테란') || race === 'T') return 'race-T';
  if (race.includes('저그') || race === 'Z') return 'race-Z';
  return '';
}

/*************************************************
 * 선수/맵 시트 데이터 (이미지·종족 보강용, 없으면 이름 기반 자동 생성으로 대체)
 *************************************************/

async function loadSheetData(){
  if (!roomId) return;

  try {
    const snap = await get(ref(db, "rooms/" + roomId + "/settings/gasUrl"));
    const gasUrl = snap.val();
    if (!gasUrl) return;

    const res = await fetch(gasUrl + "?action=getData");
    const data = await res.json();

    (data.players || []).forEach(p => { playerMap[p.name] = p; });
    (data.maps || []).forEach(m => { mapMap[m.name] = m; });
  } catch (error) {
    console.error('선수/맵 데이터 로드 실패:', error);
  }
}

/*************************************************
 * 슬롯 렌더링
 *************************************************/

function playerSlotHtml(names, isWinner){
  const list = (Array.isArray(names) ? names : [names])
    .filter(n => n && n !== '미정' && n !== '-');

  if (!list.length){
    return `<div class="slot empty">-</div>`;
  }

  const photos = list.map(name => {
    const img = playerImageUrl(name);
    return img
      ? `<img class="player-photo" src="${escapeHtml(img)}" onerror="this.style.display='none'">`
      : `<div class="player-photo"></div>`;
  }).join('');

  const nameText = list.join(', ');
  const raceClass = list.length === 1 ? playerRaceClass(list[0]) : '';
  const raceText = list.length === 1 ? (playerMap[list[0]] ? playerMap[list[0]].race || '' : '') : '팀 연합';

  return `
    <div class="slot${isWinner ? ' winner' : ''}">
      <div class="player-photo-row">${photos}</div>
      <div class="player-name">${escapeHtml(nameText)}</div>
      <div class="player-race ${raceClass}">${escapeHtml(raceText)}</div>
    </div>
  `;
}

function mapSlotHtml(name){
  if (!name || name === '미정' || name === '-'){
    return `<div class="slot empty">-</div>`;
  }

  const img = mapImageUrl(name);

  return `
    <div class="slot">
      ${img ? `<img class="map-img" src="${escapeHtml(img)}" onerror="this.style.display='none'">` : ''}
      <div class="map-name">${escapeHtml(name)}</div>
    </div>
  `;
}

/*************************************************
 * 세트 전체 렌더링
 *************************************************/

function renderSet(setObj){
  const matches = setObj && setObj.matches ? setObj.matches : {};
  const count = setObj && setObj.matchesCount ? setObj.matchesCount : 0;

  const orders = [];
  for (let i = 1; i <= count; i++){
    if (matches[i]) orders.push(i);
  }

  if (!orders.length){
    contentEl.innerHTML = `<div class="placeholder">대진표 준비중</div>`;
    subtitleEl.textContent = '';
    return;
  }

  subtitleEl.textContent = setObj.name || '';

  let html = `<div class="grid" style="grid-template-columns:repeat(${orders.length}, 1fr);">`;

  orders.forEach(i => {
    const m = matches[i];
    html += `<div class="col-label">${i}</div>`;
  });

  orders.forEach(i => {
    const m = matches[i];
    const t1 = m.t1Players || (m.t1Player ? [m.t1Player] : []);
    html += `<div class="col-slot">${playerSlotHtml(t1, m.winner === 't1')}</div>`;
  });

  orders.forEach(i => {
    const m = matches[i];
    html += `<div class="col-slot">${mapSlotHtml(m.mapName)}</div>`;
  });

  orders.forEach(i => {
    const m = matches[i];
    const t2 = m.t2Players || (m.t2Player ? [m.t2Player] : []);
    html += `<div class="col-slot">${playerSlotHtml(t2, m.winner === 't2')}</div>`;
  });

  html += `</div>`;

  contentEl.innerHTML = html;
}

/*************************************************
 * 실시간 구독
 *************************************************/

function listenBracket(){
  if (!roomId){
    contentEl.innerHTML = `<div class="placeholder">방(room) 정보가 없습니다.</div>`;
    return;
  }

  let unsubscribeSet = null;

  onValue(ref(db, "rooms/" + roomId + "/matchState/currentBracketSetId"), snapshot => {
    const setId = snapshot.val();

    if (unsubscribeSet) {
      unsubscribeSet();
      unsubscribeSet = null;
    }

    if (!setId){
      contentEl.innerHTML = `<div class="placeholder">대진표 준비중</div>`;
      subtitleEl.textContent = '';
      return;
    }

    unsubscribeSet = onValue(ref(db, "rooms/" + roomId + "/matchState/matchSetsObj/" + setId), setSnap => {
      renderSet(setSnap.val());
    });
  });
}

(async function init(){
  await loadSheetData();
  listenBracket();
})();

</script>

</body>
</html>
