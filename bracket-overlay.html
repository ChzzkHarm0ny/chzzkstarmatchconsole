<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATCH LIST</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">

<style>
:root{
  --bg:#0b0c0e;
  --card:#17191d;
  --card-2:#111317;
  --line:#2c2d33;
  --line-soft:#202228;
  --accent:#00FFA3;
  --text:#f5f7fa;
  --sub:#8c929d;
  --win:#00FFA3;
  --loss:#626771;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -15%, rgba(0,255,163,.055), transparent 34%),
    radial-gradient(circle at 8% 55%, rgba(255,255,255,.035), transparent 28%),
    radial-gradient(circle at 92% 70%, rgba(255,255,255,.025), transparent 30%),
    linear-gradient(135deg, #15171a 0%, #0d0f12 42%, #090a0c 100%);
}

body{
  color:var(--text);
  font-family:'Pretendard',Arial,sans-serif;
  overflow-x:auto;
  overflow-y:hidden;
}

#app{
  width:max-content;
  min-width:100%;
  padding:24px 28px 32px;
  position:relative;
  z-index:1;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.025) 0%,
      transparent 16%,
      transparent 82%,
      rgba(0,0,0,.18) 100%
    );
}

body::after{
  content:"";
  position:fixed;
  width:520px;
  height:520px;
  left:50%;
  top:-330px;
  transform:translateX(-50%);
  pointer-events:none;
  z-index:0;
  background:radial-gradient(circle, rgba(0,255,163,.045), transparent 68%);
  filter:blur(8px);
}

.heading{
  text-align:center;
margin:0 0 22px;
  text-shadow:0 2px 18px rgba(0,0,0,.45);
}
}

.heading-title{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
}

.heading-title::after{
  content:"";
  width:48px;
  height:3px;
  background:var(--accent);
  border-radius:99px;
}

.heading-main{
  font-size:25px;
  line-height:1;
  font-weight:900;
  letter-spacing:.08em;
}

.heading-sub{
  color:#8f96a2;
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
}

.matches{
  display:flex;
  align-items:stretch;
  gap:18px;
  width:max-content;
  margin:0 auto;
}

.match-card{
  width:248px;
  flex:0 0 248px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
}

.match-number{
  height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(180deg, rgba(0,255,163,.16), rgba(0,255,163,.055));
  border-bottom:1px solid rgba(0,255,163,.35);
  color:#fff;
  font-size:16px;
  font-weight:900;
  letter-spacing:.08em;
}

.player-side{
  min-height:205px;
  padding:20px 14px 17px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  transition:opacity .2s, filter .2s, background .2s;
}

.player-side + .map-side{
  border-top:1px solid var(--line-soft);
}

.player-side.is-winner{
  background:
    radial-gradient(circle at 50% 28%, rgba(0,255,163,.10), transparent 52%);
}

.player-side.is-loser{
  opacity:.48;
  filter:saturate(.55);
}

.player-side.unknown{
  opacity:.65;
}

.player-image{
  width:112px;
  height:112px;
  object-fit:cover;
  border-radius:14px;
  border:1px solid #3a3d45;
  background:#101216;
  display:block;
  box-shadow:0 5px 18px rgba(0,0,0,.35);
}

.player-image.placeholder{
  object-fit:contain;
  padding:18px;
  opacity:.65;
}

.player-name-row{
  margin-top:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:24px;
  max-width:100%;
}

.player-name{
  font-size:16px;
  font-weight:900;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:190px;
}

.race{
  margin-top:4px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.06em;
}

.race.protoss{color:#FFE000}
.race.terran{color:#00AFFF}
.race.zerg{color:#FF5C7A}
.race.unknown{color:#8c929d}

.result{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:31px;
  height:20px;
  padding:0 7px;
  border-radius:5px;
  font-size:9px;
  font-weight:1000;
  letter-spacing:.05em;
}

.result.win{
  color:#07120d;
  background:var(--win);
}

.result.loss{
  color:#aeb3bd;
  background:#292c32;
}

.map-side{
  min-height:285px;
  padding:14px 13px 16px;
  background:var(--card-2);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.map-box{
  width:100%;
  aspect-ratio:1 / 1;
  border:1px solid #30333b;
  border-radius:9px;
  background:#090a0c;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.map-image{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.map-placeholder{
  color:#555b66;
  font-size:10px;
  font-weight:800;
  letter-spacing:.12em;
}

.map-name{
  margin-top:10px;
  color:#fff;
  font-size:14px;
  line-height:1.2;
  font-weight:900;
  text-align:center;
}

.team-stack{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

.team-player{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
}

.team-player .player-image{
  width:88px;
  height:88px;
}

.team-player .player-name{
  font-size:14px;
  max-width:180px;
}

.team-player .race{
  font-size:10px;
}

.status{
  position:fixed;
  right:14px;
  bottom:10px;
  color:#5f6570;
  font-size:9px;
  font-weight:700;
  pointer-events:none;
}

@media (max-width:900px){
  #app{padding:18px}
  .matches{gap:12px}
  .match-card{
    width:220px;
    flex-basis:220px;
  }
  .player-image{
    width:100px;
    height:100px;
  }
}

body.compact .match-card{
  width:225px;
  flex-basis:225px;
}
body.compact .player-side{
  min-height:190px;
}
body.compact .map-side{
  min-height:255px;
}
</style>
</head>

<body>
<div id="app">
  <header class="heading">
    <div class="heading-title">
      <div class="heading-main">MATCH LIST</div>
      <div class="heading-sub" id="set-name">불러오는 중</div>
    </div>
  </header>

  <main id="matches" class="matches"></main>
</div>

<div id="status" class="status"></div>

<script type="module">
import { ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
import { db } from "./firebase-config.js";

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbwIaEwJ1F-QdLoMEyY_xRCRHAeYPNqPSIaV0EISKXlqDQbHlgfbM--_VC_A6a052LQ7UQ/exec";

const PLAYER_IMAGE_BASE =
  "https://raw.githubusercontent.com/ChzzkHarm0ny/SZD/main/images/";

const params = new URLSearchParams(location.search);
const roomId = params.get("room");
const forcedSetId = params.get("set");

let players = [];
let maps = [];

let playerMap = new Map();
let mapMap = new Map();

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function norm(value){
  return String(value ?? "").trim();
}

function playerInfo(name){
  const n = norm(name);

  if(!n || n === "-" || n === "미정"){
    return {
      name: n || "미정",
      race: "미정",
      img: ""
    };
  }

  const found = playerMap.get(n);

  if(found){
    return {
      name: found.name || n,
      race: found.race || "미정",
      img: found.img || ""
    };
  }

  return {
    name:n,
    race:"미정",
    img:PLAYER_IMAGE_BASE + encodeURIComponent(n) + ".png"
  };
}

function mapInfo(name){
  const n = norm(name);

  if(!n || n === "미정"){
    return {
      name:"미정",
      img:""
    };
  }

  const found = mapMap.get(n);

  if(found){
    return {
      name:found.name || n,
      // 수정된 Code.gs에서 Maps!B열의 실제 URL을 반환한다.
      img:found.url || ""
    };
  }

  return {
    name:n,
    img:""
  };
}

function raceClass(race){
  const r = norm(race).toLowerCase();

  if(r.includes("프로토스") || r.includes("protoss")) return "protoss";
  if(r.includes("테란") || r.includes("terran")) return "terran";
  if(r.includes("저그") || r.includes("zerg")) return "zerg";

  return "unknown";
}

function makePlayerImage(player, small=false){
  const sizeClass = small ? "team-player" : "";

  if(!player.img){
    return `
      <div class="team-player ${sizeClass}">
        <div class="player-image placeholder">P</div>
      </div>
    `;
  }

  const fallback =
    PLAYER_IMAGE_BASE +
    encodeURIComponent(player.name) +
    ".png";

  return `
    <div class="team-player ${sizeClass}">
      <img
        class="player-image"
        src="${esc(player.img)}"
        alt=""
        data-fallback="${esc(fallback)}"
      >
    </div>
  `;
}

function playerHtml(name, winner, side, format){
  const p = playerInfo(name);

  const valid = p.name !== "미정" && p.name !== "-";
  const winnerSide = winner === side;
  const loserSide = winner && winner !== side;

  const resultHtml =
    winnerSide
      ? `<span class="result win">WIN</span>`
      : loserSide
        ? `<span class="result loss">LOSS</span>`
        : "";

  if(format > 1){
    return `
      <div class="team-player ${winnerSide ? "is-winner" : ""} ${loserSide ? "is-loser" : ""}">
        ${
          p.img
            ? `<img class="player-image" src="${esc(p.img)}" alt="" data-fallback="${esc(PLAYER_IMAGE_BASE + encodeURIComponent(p.name) + ".png")}">`
            : `<div class="player-image placeholder">P</div>`
        }
        <div class="player-name-row">
          <span class="player-name">${esc(p.name)}</span>
          ${resultHtml}
        </div>
        <div class="race ${raceClass(p.race)}">${esc(p.race)}</div>
      </div>
    `;
  }

  return `
    <div class="player-side ${!valid ? "unknown" : ""} ${winnerSide ? "is-winner" : ""} ${loserSide ? "is-loser" : ""}">
      ${
        p.img
          ? `<img class="player-image" src="${esc(p.img)}" alt="" data-fallback="${esc(PLAYER_IMAGE_BASE + encodeURIComponent(p.name) + ".png")}">`
          : `<div class="player-image placeholder">P</div>`
      }
      <div class="player-name-row">
        <span class="player-name">${esc(p.name)}</span>
        ${resultHtml}
      </div>
      <div class="race ${raceClass(p.race)}">${esc(p.race)}</div>
    </div>
  `;
}

function teamHtml(names, winner, side, format){
  if(format <= 1){
    return playerHtml(names[0] || "미정", winner, side, 1);
  }

  const teamWinner = winner === side;
  const teamLoser = winner && winner !== side;

  const members = names.map(name => {
    const p = playerInfo(name);

    return `
      <div class="team-player ${teamWinner ? "is-winner" : ""} ${teamLoser ? "is-loser" : ""}">
        ${
          p.img
            ? `<img class="player-image" src="${esc(p.img)}" alt="" data-fallback="${esc(PLAYER_IMAGE_BASE + encodeURIComponent(p.name) + ".png")}">`
            : `<div class="player-image placeholder">P</div>`
        }
        <div class="player-name-row">
          <span class="player-name">${esc(p.name)}</span>
        </div>
        <div class="race ${raceClass(p.race)}">${esc(p.race)}</div>
      </div>
    `;
  }).join("");

  return `
    <div class="player-side ${teamWinner ? "is-winner" : ""} ${teamLoser ? "is-loser" : ""}">
      <div class="team-stack">${members}</div>
      ${
        teamWinner
          ? `<span class="result win" style="margin-top:8px">WIN</span>`
          : teamLoser
            ? `<span class="result loss" style="margin-top:8px">LOSS</span>`
            : ""
      }
    </div>
  `;
}

function mapHtml(name){
  const m = mapInfo(name);

  return `
    <div class="map-side">
      <div class="map-box">
        ${
          m.img
            ? `<img class="map-image" src="${esc(m.img)}" alt="" data-map-name="${esc(m.name)}">`
            : `<div class="map-placeholder">NO IMAGE</div>`
        }
      </div>
      <div class="map-name">${esc(m.name)}</div>
    </div>
  `;
}

function render(setObj){
  const container = document.getElementById("matches");

  if(!setObj){
    document.getElementById("set-name").textContent = "대진표 없음";
    container.innerHTML = "";
    return;
  }

  document.getElementById("set-name").textContent =
    setObj.name || `${setObj.id}세트`;

  const count = Number(setObj.matchesCount || 0);
  const matches = setObj.matches || {};

  let html = "";

  for(let i=1; i<=count; i++){
    const m = matches[i] || matches[String(i)] || {};
    const format = Number(m.matchFormat || 1);

    const t1 =
      Array.isArray(m.t1Players)
        ? m.t1Players
        : [m.t1Player || "미정"];

    const t2 =
      Array.isArray(m.t2Players)
        ? m.t2Players
        : [m.t2Player || "미정"];

    while(t1.length < format) t1.push("미정");
    while(t2.length < format) t2.push("미정");

    html += `
      <article class="match-card">
        <div class="match-number">${String(i).padStart(2,"0")}</div>

        ${teamHtml(t1, m.winner || "", "t1", format)}

        ${mapHtml(m.mapName || "미정")}

        ${teamHtml(t2, m.winner || "", "t2", format)}
      </article>
    `;
  }

  container.innerHTML = html;

  // 이미지가 실제로 실패했을 때 선수는 기존 GitHub 기본 주소로 한 번 더 시도.
  document.querySelectorAll("img[data-fallback]").forEach(img => {
    img.addEventListener("error", () => {
      const fallback = img.dataset.fallback;
      if(!fallback || img.src === fallback) return;
      img.src = fallback;
    }, {once:true});
  });

  // 맵은 Maps!B열 URL을 그대로 사용한다.
  // 실패 시에는 NO IMAGE만 표시하고 이미지를 잘라내지 않는다.
  document.querySelectorAll("img[data-map-name]").forEach(img => {
    img.addEventListener("error", () => {
      const box = img.parentElement;
      if(box){
        img.remove();
        const placeholder = document.createElement("div");
        placeholder.className = "map-placeholder";
        placeholder.textContent = "NO IMAGE";
        box.appendChild(placeholder);
      }
    }, {once:true});
  });
}

async function loadSheetData(){
  if(!GAS_URL) return;

  try{
    const res = await fetch(GAS_URL + "?action=getData", {
      cache:"no-store"
    });

    if(!res.ok) throw new Error("Google Sheets API HTTP " + res.status);

    const data = await res.json();

    players = Array.isArray(data.players) ? data.players : [];
    maps = Array.isArray(data.maps) ? data.maps : [];

    playerMap = new Map(
      players
        .filter(p => p && p.name)
        .map(p => [norm(p.name), p])
    );

    mapMap = new Map(
      maps
        .filter(m => m && m.name)
        .map(m => [norm(m.name), m])
    );
  }catch(error){
    console.error("[BRACKET] 시트 데이터 로드 실패", error);
  }
}

function chooseSet(matchSets){
  const keys = Object.keys(matchSets || {});

  if(!keys.length) return null;

  // index.html의 [대진 반영]에서 저장하는 setId를 우선 사용.
  if(forcedSetId && matchSets[forcedSetId]){
    return matchSets[forcedSetId];
  }

  // bracketSetId가 있으면 그것을 사용.
  const savedSet =
    window.__bracketSetId &&
    matchSets[window.__bracketSetId];

  if(savedSet) return savedSet;

  // 별도 지정이 없으면 1세트, 없으면 첫 번째 세트.
  return matchSets[1] || matchSets[keys[0]];
}

async function start(){
  if(!roomId){
    document.getElementById("set-name").textContent =
      "room 파라미터가 필요합니다";
    return;
  }

  await loadSheetData();

  const roomRef =
    ref(db, "rooms/" + roomId + "/matchState");

  onValue(roomRef, snapshot => {
    const state = snapshot.val() || {};
    const matchSets = state.matchSetsObj || {};

    window.__bracketSetId =
      state.bracketSetId != null
        ? String(state.bracketSetId)
        : null;

    const selected = chooseSet(matchSets);
    render(selected);
  });
}

start();
</script>
</body>
</html>
