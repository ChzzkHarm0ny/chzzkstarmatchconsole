<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHZZK StarCraft - Match Bracket</title>
<style>
:root{
  --bg:#0b0c0e;
  --panel:#141518;
  --panel2:#1b1c20;
  --line:#2c2d33;
  --line-soft:#202126;
  --green:#00FFA3;
  --white:#f5f7f8;
  --muted:#8d929b;
  --p1:#0C48CC;
  --p2:#F40404;
  --p1text:#fff;
  --p2text:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;color:var(--white)}

#app{width:100vw;height:100vh;padding:24px 30px;overflow:hidden}

/* ---------- header ---------- */
.header{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;margin-bottom:20px;text-align:center}
.title{font-size:26px;line-height:1;font-weight:1000;letter-spacing:.16em;color:#fff}
.title::after{content:"";display:block;width:54px;height:2px;margin:9px auto 0;background:var(--green);border-radius:2px}
.set-name{font-size:11px;color:#aeb3bb;font-weight:800;letter-spacing:.08em}

/* ---------- horizontal board ---------- */
.viewport{width:100%;height:calc(100vh - 112px);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.viewport::-webkit-scrollbar{display:none}
.board{width:max-content;min-width:100%;display:flex;align-items:stretch;gap:10px;padding:2px 4px 28px}

/* ---------- one match ---------- */
.match{width:232px;flex:0 0 232px;display:flex;flex-direction:column;position:relative;background:rgba(20,21,24,.97);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.match::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--green);opacity:.8}

.match-number{height:44px;display:flex;align-items:center;justify-content:center;padding:0 12px;border-bottom:1px solid rgba(0,255,163,.20);background:linear-gradient(180deg,#163027,#101d19);position:relative}
.match-number strong{font-size:14px;font-weight:1000;letter-spacing:.06em;color:#f5f7f8}
.match-number span{display:none}

/* ---------- team block ---------- */
.team{padding:14px 10px 13px;background:var(--panel2);border-bottom:1px solid var(--line-soft);transition:.2s;text-align:center}
.team:last-of-type{border-bottom:0}
.team.winner{background:linear-gradient(180deg,rgba(0,255,163,.13),rgba(0,255,163,.035));box-shadow:inset 0 0 0 1px rgba(0,255,163,.22)}
.team.loser{opacity:.54}

.team-label{display:flex;align-items:center;justify-content:center;min-height:12px;margin-bottom:7px}
.team-label .side{display:none}
.result{font-size:9px;font-weight:1000;letter-spacing:.12em;color:transparent;min-height:11px}
.team.winner .result{color:var(--green)}
.team.loser .result{color:#666b74}

.players{display:flex;align-items:center;justify-content:center;gap:7px;min-height:76px}
.player{min-width:0;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.player-img{width:72px;height:72px;object-fit:contain;border-radius:8px;border:1px solid #3a3c43;background:#0b0c0e;display:block}
.player-name{max-width:100%;margin-top:7px;font-size:12px;font-weight:1000;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-race{margin-top:3px;font-size:8px;font-weight:1000;letter-spacing:.08em}

/* Team play: multiple images become compact but remain visible */
.team.multi .players{gap:4px}
.team.multi .player-img{width:43px;height:43px;border-radius:6px}
.team.multi .player-name{font-size:9px}
.team.multi .player-race{display:none}
.team.multi .player{max-width:62px}

/* ---------- map: square area, never cropped ---------- */
.map-section{padding:12px 10px 13px;background:#101114;border-top:1px solid #24262b;border-bottom:1px solid #24262b;text-align:center}
.map-box{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#08090b;border:1px solid #303239;border-radius:8px;overflow:hidden}
.map-img{display:block;width:100%;height:100%;object-fit:contain;padding:5px}
.map-placeholder{color:#555a63;font-size:9px;font-weight:900;letter-spacing:.1em}
.map-name{margin-top:8px;color:#e7eaed;font-size:11px;font-weight:1000;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- subtle connector between columns ---------- */
.connector{width:10px;flex:0 0 10px;display:flex;align-items:center;justify-content:center;position:relative}
.connector::after{content:"";width:10px;height:1px;background:#35373d}

.empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#6c7179;font-size:13px;font-weight:900}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--green);font-size:13px;font-weight:900}

/* ---------- winner accent ---------- */
.winner-mark{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--green);color:#06120d;font-size:10px;font-weight:1000;box-shadow:0 0 10px rgba(0,255,163,.25);position:absolute;right:12px}


@media(max-width:1200px){
  #app{padding:20px}
  .match{width:214px;flex-basis:214px}
  .player-img{width:66px;height:66px}
}
</style>
</head>
<body>
<div id="app">
  <header class="header" id="header" style="display:none">
    <div class="title">MATCH LIST</div>
    <div id="set-name" class="set-name"></div>
  </header>

  <div id="viewport" class="viewport">
    <div id="board" class="board"></div>
  </div>
  <div id="loading" class="loading">대진표를 불러오는 중...</div>
</div>

<script type="module">
import { ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
import { db } from "./firebase-config.js";

const params = new URLSearchParams(location.search);
const roomId = params.get('room');

let allPlayers = [];
let allMaps = [];
let playerColors = {
  player1Color:'#0C48CC',
  player2Color:'#F40404',
  player1TextColor:'#ffffff',
  player2TextColor:'#ffffff'
};

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? '').replace(/[&<>'"]/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'
  }[c]));
}

function findPlayer(name){
  return allPlayers.find(p=>String(p?.name||'')===String(name||'')) || {
    name:name || '미정', race:'', img_url:'', img:''
  };
}

function playerImage(p, fallback){
  const direct = p?.img_url || p?.img || p?.image || p?.url;
  if(direct) return direct;
  if(p?.name && p.name !== '미정' && p.name !== '-'){
    return 'https://raw.githubusercontent.com/ChzzkHarm0ny/SZD/main/images/' + encodeURIComponent(p.name) + '.png';
  }
  return 'https://placehold.co/100x100/141518/6f747c?text=' + encodeURIComponent(fallback || '?');
}

function findMap(name){
  return allMaps.find(m=>String(m?.name||'')===String(name||'')) || {name:name || '미정', url:'', img:''};
}

function mapImage(m){
  const direct = m?.url || m?.img || m?.img_url || m?.image;
  if(direct) return direct;
  if(m?.name && m.name !== '미정'){
    return 'https://raw.githubusercontent.com/ChzzkHarm0ny/SZD/main/maps/' + encodeURIComponent(m.name) + '.png';
  }
  return '';
}

function raceClass(race){
  const r = String(race||'').toUpperCase();
  if(r.includes('프로') || r === 'P' || r.includes('P')) return 'P';
  if(r.includes('테란') || r === 'T' || r.includes('T')) return 'T';
  if(r.includes('저그') || r === 'Z' || r.includes('Z')) return 'Z';
  return '';
}

function raceText(race){
  const c = raceClass(race);
  if(c==='P') return 'PROTOSS';
  if(c==='T') return 'TERRAN';
  if(c==='Z') return 'ZERG';
  return race || '';
}

function setThemeColors(){
  document.documentElement.style.setProperty('--p1',playerColors.player1Color || '#0C48CC');
  document.documentElement.style.setProperty('--p2',playerColors.player2Color || '#F40404');
  document.documentElement.style.setProperty('--p1text',playerColors.player1TextColor || '#ffffff');
  document.documentElement.style.setProperty('--p2text',playerColors.player2TextColor || '#ffffff');
}

function teamBlock(players, side, winner, format){
  const valid = players.filter(x=>x && x!=='-' && x!=='미정');
  const display = valid.length ? valid : ['미정'];
  const multi = display.length > 1;
  const isWinner = winner === side;
  const hasResult = winner === 't1' || winner === 't2';
  const loser = hasResult && !isWinner;
  const color = side === 't1' ? 'var(--p1)' : 'var(--p2)';
  const textColor = side === 't1' ? 'var(--p1text)' : 'var(--p2text)';

  return `
    <div class="team ${multi?'multi':''} ${isWinner?'winner':''} ${loser?'loser':''}" style="--team-color:${color};--team-text:${textColor}">
      <div class="team-label">
        <span class="side">${side === 't1' ? 'PLAYER 1 / TEAM 1' : 'PLAYER 2 / TEAM 2'}</span>
        ${isWinner ? '<span class="winner-mark">✓</span>' : `<span class="result">${hasResult?'LOSS':''}</span>`}
      </div>
      <div class="players">
        ${display.map((name,index)=>{
          const p = findPlayer(name);
          const img = playerImage(p, side === 't1' ? 'P1' : 'P2');
          const race = raceText(p.race);
          return `
            <div class="player">
              <img class="player-img" src="${esc(img)}" alt="" onerror="this.src='https://placehold.co/100x100/141518/6f747c?text=${side==='t1'?'P1':'P2'}'">
              <div class="player-name" style="color:${textColor}">${esc(p.name)}</div>
              ${race ? `<div class="player-race" style="color:${side==='t1'?'#7da6ff':'#ff8c8c'}">${esc(race)}</div>` : ''}
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

function render(state){
  const sets = state.matchSetsObj || state.matchSetsConfig || {};
  const ids = Object.keys(sets).map(Number).filter(Number.isFinite).sort((a,b)=>a-b);
  if(!ids.length){
    $('loading').textContent='대진표가 아직 없습니다.';
    $('loading').style.display='flex';
    $('header').style.display='none';
    $('board').innerHTML='';
    return;
  }

  const requested = Number(state.bracketCurrentSetId || params.get('set') || ids[0]);
  const setId = sets[requested] ? requested : ids[0];
  const currentSet = sets[setId] || {};
  const total = Number(currentSet.matchesCount || 0);
  const matches = currentSet.matches || {};

  setThemeColors();
  $('loading').style.display='none';
  $('header').style.display='flex';
  $('set-name').textContent = currentSet.name || `${setId}세트`;

  if(total <= 0){
    $('board').innerHTML='<div class="empty">등록된 대진이 없습니다.</div>';
    return;
  }

  let html='';
  for(let i=1;i<=total;i++){
    const m = matches[i] || {};
    const format = Math.max(1,Number(m.matchFormat || 1));
    const t1 = (m.t1Players || [m.t1Player || '미정']).slice(0,format);
    const t2 = (m.t2Players || [m.t2Player || '미정']).slice(0,format);
    const mapData = findMap(m.mapName);
    const mapSrc = mapImage(mapData);
    const winner = m.winner || '';

    html += `
      <article class="match">
        <div class="match-number">
          <strong>${String(i).padStart(2,'0')}</strong>
          <span>MATCH</span>
        </div>

        ${teamBlock(t1,'t1',winner,format)}

        <div class="map-section">
          <div class="map-box">
            ${mapSrc
              ? `<img class="map-img" src="${esc(mapSrc)}" alt="${esc(mapData.name||'map')}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
              : ''}
            <span class="map-placeholder" style="${mapSrc?'display:none':''}">NO IMAGE</span>
          </div>
          <div class="map-name">${esc(mapData.name || '미정')}</div>
        </div>

        ${teamBlock(t2,'t2',winner,format)}
      </article>`;

    if(i<total) html += '<div class="connector" aria-hidden="true"></div>';
  }

  $('board').innerHTML=html;
}

if(!roomId){
  $('loading').textContent='room 파라미터가 없습니다.';
}else{
  onValue(ref(db,`rooms/${roomId}/matchState`),snapshot=>{
    const state = snapshot.val() || {};
    allPlayers = state.players || [];
    allMaps = state.maps || [];
    playerColors = state.playerColors || playerColors;
    render(state);
  });
}
</script>
</body>
</html>
