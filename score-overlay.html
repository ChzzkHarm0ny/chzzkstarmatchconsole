<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CHZZK Minimap Scoreboard Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: rgba(0, 0, 0, 0); margin: 0; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        
        .minimap-scoreboard {
            width: 320px;
            height: 112px; 
            background: transparent;
            border: 2px solid #3c3d44;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            clip-path: polygon(
                0% 0%, 
                100% 0%, 
                100% 100%, 
                78% 100%, 
                68% 58%, 
                32% 58%, 
                22% 100%, 
                0% 100%
            );
            position: relative;
        }

        .leg-left {
            position: absolute;
            bottom: 4px;
            left: 8px;
            width: 90px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 2px;
        }
        
        .leg-right {
            position: absolute;
            bottom: 4px;
            right: 8px;
            width: 90px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            gap: 2px;
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');

            if (!roomId) return;

            const roomRef = ref(db, "rooms/" + roomId);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val() || {};
                let ms = data.matchState || {};
                
                let scoreboardEl = document.getElementById('scoreboard-wrapper');
                if (ms.scoreVisible === false) {
                    scoreboardEl.style.opacity = '0';
                    return;
                } else {
                    scoreboardEl.style.opacity = '1';
                }

                let manual = data.manualScore || {
                    showTitle: true, showTeam: true, showPlayer: true, showBottom: true,
                    title: "[1세트]", 
                    t1Name: "1팀", t1Score: 0, t2Score: 0, t2Name: "2팀",
                    p1Name: "선수1", p1Score: 0, p2Score: 0, p2Name: "선수2",
                    pos1: "", pos2: ""
                };

                let teamNames = ms.teamNames || { team1Color: "#1d3557", team2Color: "#6a1b1b" };

                // 1. 체크박스에 따른 표시/숨김 처리
                document.getElementById('row-title').style.display = manual.showTitle ? 'flex' : 'none';
                document.getElementById('row-team').style.display = manual.showTeam ? 'grid' : 'none';
                document.getElementById('row-player').style.display = manual.showPlayer ? 'grid' : 'none';
                document.getElementById('row-bottom').style.display = manual.showBottom ? 'flex' : 'none';

                // 2. 텍스트가 가려지지 않도록 컬러 배경을 가상 요소 겹치기 기법으로 세팅
                document.getElementById('bg-team1').style.backgroundColor = teamNames.team1Color;
                document.getElementById('bg-team2').style.backgroundColor = teamNames.team2Color;
                
                document.getElementById('bg-score-t1').style.backgroundColor = teamNames.team1Color;
                document.getElementById('bg-score-t2').style.backgroundColor = teamNames.team2Color;

                document.getElementById('bg-player1').style.backgroundColor = teamNames.team1Color;
                document.getElementById('bg-player2').style.backgroundColor = teamNames.team2Color;

                document.getElementById('bg-score-p1').style.backgroundColor = teamNames.team1Color;
                document.getElementById('bg-score-p2').style.backgroundColor = teamNames.team2Color;

                // 3. 수동 입력된 텍스트 및 점수 데이터 꽂아넣기
                document.getElementById('text-title').innerText = manual.title || "";
                
                document.getElementById('text-team1').innerText = manual.t1Name || "";
                document.getElementById('score-team1').innerText = manual.t1Score || "0";
                document.getElementById('score-team2').innerText = manual.t2Score || "0";
                document.getElementById('text-team2').innerText = manual.t2Name || "";

                document.getElementById('text-player1').innerText = manual.p1Name || "";
                document.getElementById('score-player1').innerText = manual.p1Score || "0";
                document.getElementById('score-player2').innerText = manual.p2Score || "0";
                document.getElementById('text-player2').innerText = manual.p2Name || "";

                document.getElementById('text-pos1').innerText = manual.pos1 || "";
                document.getElementById('text-pos2').innerText = manual.pos2 || "";
            });
        };
    </script>
</head>
<body class="flex items-start justify-start p-0">
    <div id="scoreboard-wrapper" class="minimap-scoreboard flex flex-col text-white font-sans bg-[#1b1c20]">
        
        <!-- 1. 공지 (Title Row) -->
        <div id="row-title" class="bg-[#141518] border-b border-[#2c2d33] h-[20px] flex items-center justify-center shrink-0">
            <span id="text-title" class="text-[#00FFA3] text-[11px] font-black tracking-wider"></span>
        </div>
        
        <!-- 2. 팀 로우 (Team Row) -->
        <!-- grid-cols-[1fr_32px_32px_1fr] 로 칸 비율을 칼같이 통일 -->
        <div id="row-team" class="grid grid-cols-[1fr_32px_32px_1fr] h-[26px] text-sm font-black text-center items-center shrink-0 border-b border-[#2c2d33]">
            <div id="bg-team1" class="relative h-full flex items-center justify-center px-1 truncate shadow text-white">
                <span id="text-team1" class="relative z-10 truncate text-[12px] font-black drop-shadow-md"></span>
            </div>
            
            <div id="bg-score-t1" class="relative h-full flex items-center justify-center border-r border-[#1b1c20]">
                <div class="absolute inset-0 bg-black/30"></div> <!-- 어둡게 만드는 반투명 레이어 -->
                <span id="score-team1" class="relative z-10 text-white text-[14px] font-black drop-shadow-md">0</span>
            </div>
            
            <div id="bg-score-t2" class="relative h-full flex items-center justify-center border-l border-[#1b1c20]">
                <div class="absolute inset-0 bg-black/30"></div>
                <span id="score-team2" class="relative z-10 text-white text-[14px] font-black drop-shadow-md">0</span>
            </div>
            
            <div id="bg-team2" class="relative h-full flex items-center justify-center px-1 truncate shadow text-white">
                <span id="text-team2" class="relative z-10 truncate text-[12px] font-black drop-shadow-md"></span>
            </div>
        </div>

        <!-- 3. 선수 로우 (Player Row) -->
        <div id="row-player" class="grid grid-cols-[1fr_32px_32px_1fr] h-[26px] text-sm font-black text-center items-center shrink-0 border-b border-[#2c2d33]">
            <div id="bg-player1" class="relative h-full flex items-center justify-center px-1 truncate shadow text-gray-200">
                <div class="absolute inset-0 bg-black/30"></div>
                <span id="text-player1" class="relative z-10 truncate text-[11.5px] font-black drop-shadow-md"></span>
            </div>
            
            <div id="bg-score-p1" class="relative h-full flex items-center justify-center border-r border-[#1b1c20]">
                <div class="absolute inset-0 bg-black/50"></div> <!-- 조금 더 어둡게 -->
                <span id="score-player1" class="relative z-10 text-gray-100 text-[13px] font-black drop-shadow-md">0</span>
            </div>
            
            <div id="bg-score-p2" class="relative h-full flex items-center justify-center border-l border-[#1b1c20]">
                <div class="absolute inset-0 bg-black/50"></div>
                <span id="score-player2" class="relative z-10 text-gray-100 text-[13px] font-black drop-shadow-md">0</span>
            </div>
            
            <div id="bg-player2" class="relative h-full flex items-center justify-center px-1 truncate shadow text-gray-200">
                <div class="absolute inset-0 bg-black/30"></div>
                <span id="text-player2" class="relative z-10 truncate text-[11.5px] font-black drop-shadow-md"></span>
            </div>
        </div>
        
        <!-- 4. 하단 위치 (Bottom Leg Row) -->
        <div id="row-bottom" class="flex-grow relative bg-[#0b0c0e]">
            <div class="leg-left">
                <div id="text-pos1" class="text-[#00FFA3] text-[12px] font-black w-full text-left tracking-wider" style="text-shadow: 1px 1px 2px black;"></div>
            </div>
            <div class="leg-right">
                <div id="text-pos2" class="text-[#00FFA3] text-[12px] font-black w-full text-right tracking-wider" style="text-shadow: 1px 1px 2px black;"></div>
            </div>
        </div>

    </div>
</body>
</html>
