<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CHZZK Custom Frame Scoreboard Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: rgba(0, 0, 0, 0); margin: 0; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        
        .minimap-scoreboard {
            width: 320px;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            display: flex;
            flex-direction: column;
            position: relative;
            justify-content: flex-end;
        }

        .frame-top {
            background-image: url('https://raw.githubusercontent.com/ChzzkHarm0ny/chzzkstarmatchconsole/refs/heads/main/Image/frames_top.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        .frame-middle {
            background-image: url('https://raw.githubusercontent.com/ChzzkHarm0ny/chzzkstarmatchconsole/refs/heads/main/Image/frames_middle.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        /* 하단 프레임 (직사각형 공간을 채우거나 새로 만드신 이미지) */
        .frame-bottom {
            background-image: url('https://raw.githubusercontent.com/ChzzkHarm0ny/chzzkstarmatchconsole/refs/heads/main/Image/frames_bottom.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        .row-hidden {
            display: none !important;
        }
    </style>
</head>
<body class="flex items-end justify-start p-0">
    <div id="scoreboard-wrapper" class="minimap-scoreboard text-white font-sans">
        
        <!-- [1] 상단 공지 영역 -->
        <div id="row-title" class="relative w-full h-[24px] shrink-0">
            <div class="absolute inset-0 z-10 bg-[#111111]"></div>
            <div class="absolute inset-0 z-20 frame-top pointer-events-none"></div>
            <div class="absolute inset-0 z-30 flex items-center justify-center h-full">
                <span id="text-title" class="text-[#00FFA3] font-black tracking-wider text-[13px] drop-shadow-md">[1세트]</span>
            </div>
        </div>
        
        <!-- [2] 팀 영역 -->
        <div id="row-team" class="relative w-full h-[28px] shrink-0">
            <div class="absolute inset-0 z-10 grid grid-cols-[1fr_36px_36px_1fr]">
                <div id="bg-team1" style="background-color: #1d3557;"></div>
                <div class="bg-[#111111] col-span-2"></div>
                <div id="bg-team2" style="background-color: #6a1b1b;"></div>
            </div>
            <div class="absolute inset-0 z-20 frame-middle pointer-events-none"></div>
            <div class="absolute inset-0 z-30 grid grid-cols-[1fr_36px_36px_1fr] font-black text-center items-center h-full">
                <div id="text-team1" class="px-2 truncate text-white text-[13.5px] drop-shadow-md">1팀</div>
                <div class="flex items-center justify-center text-white text-[15px] drop-shadow-md"><span id="score-team1">0</span></div>
                <div class="flex items-center justify-center text-white text-[15px] drop-shadow-md"><span id="score-team2">0</span></div>
                <div id="text-team2" class="px-2 truncate text-white text-[13.5px] drop-shadow-md">2팀</div>
            </div>
        </div>

        <!-- [3] 선수 영역 -->
        <div id="row-player" class="relative w-full h-[28px] shrink-0">
            <div class="absolute inset-0 z-10 grid grid-cols-[1fr_36px_36px_1fr]">
                <div id="bg-player1" class="col-span-2" style="background-color: #0C48CC;"></div>
                <div id="bg-player2" class="col-span-2" style="background-color: #F40404;"></div>
            </div>
            <div class="absolute inset-0 z-20 frame-middle pointer-events-none"></div>
            <div class="absolute inset-0 z-30 grid grid-cols-[1fr_36px_36px_1fr] font-black text-center items-center h-full">
                <div id="text-player1" class="px-2 truncate font-bold text-[13px]" style="color: #ffffff;">선수1</div>
                <div class="flex items-center justify-center font-black drop-shadow-md"><span id="score-player1" style="color:#ffffff;">0</span></div>
                <div class="flex items-center justify-center font-black drop-shadow-md"><span id="score-player2" style="color:#ffffff;">0</span></div>
                <div id="text-player2" class="px-2 truncate font-bold text-[13px]" style="color: #ffffff;">선수2</div>
            </div>
        </div>

        <!-- [4] 하단 프레임 영역 (bottom 프레임이 정상 출력됨) -->
        <div id="row-bottom" class="relative w-full h-[42px] shrink-0">
            <div class="absolute inset-0 z-10 bg-[#111111]"></div>
            <div class="absolute inset-0 z-20 frame-bottom pointer-events-none"></div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function renderTextFit(id, text, defaultSize) {
            let el = document.getElementById(id);
            if (!el) return;
            el.innerText = text;
            el.style.whiteSpace = "nowrap";
            
            let len = (text || "").length;
            if (len >= 18) {
                el.style.fontSize = (defaultSize - 3) + "px";
                el.style.transform = "scaleX(0.7)";
            } else if (len >= 12) {
                el.style.fontSize = (defaultSize - 2) + "px";
                el.style.transform = "scaleX(0.8)";
            } else if (len >= 8) {
                el.style.fontSize = (defaultSize - 1) + "px";
                el.style.transform = "scaleX(0.9)";
            } else {
                el.style.fontSize = defaultSize + "px";
                el.style.transform = "scaleX(1)";
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        if (roomId) {
            const roomRef = ref(db, "rooms/" + roomId);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val() || {};
                let ms = data.matchState || {};
                
                let scoreboardEl = document.getElementById('scoreboard-wrapper');
                if (scoreboardEl) {
                    if (ms.scoreVisible === false) {
                        scoreboardEl.style.opacity = '0';
                        return;
                    } else {
                        scoreboardEl.style.opacity = '1';
                    }
                }

                let manual = data.manualScore || {
                    showTitle: true, showTeam: true, showPlayer: true, showBottom: true,
                    title: "[1세트]", 
                    t1Name: "1팀", t1Score: 0, t2Score: 0, t2Name: "2팀",
                    p1Name: "선수1", p1Score: 0, p2Score: 0, p2Name: "선수2"
                };

                let teamNames = ms.teamNames || { team1Color: "#1d3557", team2Color: "#6a1b1b" };
                let playerColors = ms.playerColors || { player1Color: "#0C48CC", player2Color: "#F40404", player1TextColor: "#ffffff", player2TextColor: "#ffffff" };

                let rowTitle = document.getElementById('row-title');
                if (rowTitle) rowTitle.style.display = manual.showTitle === false ? 'none' : 'block';

                let rowTeam = document.getElementById('row-team');
                if (rowTeam) rowTeam.style.display = manual.showTeam === false ? 'none' : 'block';

                let rowPlayer = document.getElementById('row-player');
                if (rowPlayer) rowPlayer.style.display = manual.showPlayer === false ? 'none' : 'block';

                let rowBottom = document.getElementById('row-bottom');
                if (rowBottom) rowBottom.style.display = manual.showBottom === false ? 'none' : 'block';

                let bgT1 = document.getElementById('bg-team1'); if(bgT1) bgT1.style.backgroundColor = teamNames.team1Color || "#1d3557";
                let bgT2 = document.getElementById('bg-team2'); if(bgT2) bgT2.style.backgroundColor = teamNames.team2Color || "#6a1b1b";

                let bgP1 = document.getElementById('bg-player1'); if(bgP1) bgP1.style.backgroundColor = playerColors.player1Color || "#0C48CC";
                let bgP2 = document.getElementById('bg-player2'); if(bgP2) bgP2.style.backgroundColor = playerColors.player2Color || "#F40404";

                let txtP1 = document.getElementById('text-player1');
                let scP1 = document.getElementById('score-player1');
                if(txtP1) txtP1.style.color = playerColors.player1TextColor || "#ffffff";
                if(scP1) scP1.style.color = playerColors.player1TextColor || "#ffffff";

                let txtP2 = document.getElementById('text-player2');
                let scP2 = document.getElementById('score-player2');
                if(txtP2) txtP2.style.color = playerColors.player2TextColor || "#ffffff";
                if(scP2) scP2.style.color = playerColors.player2TextColor || "#ffffff";

                renderTextFit('text-title', manual.title || "", 13);         
                renderTextFit('text-team1', manual.t1Name || "", 13.5);     
                document.getElementById('score-team1').innerText = manual.t1Score || "0";
                document.getElementById('score-team2').innerText = manual.t2Score || "0";
                renderTextFit('text-team2', manual.t2Name || "", 13.5);     

                renderTextFit('text-player1', manual.p1Name || "", 13);     
                document.getElementById('score-player1').innerText = manual.p1Score || "0";
                document.getElementById('score-player2').innerText = manual.p2Score || "0";
                renderTextFit('text-player2', manual.p2Name || "", 13);     
            });
        }
    </script>
</body>
</html>
