<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CHZZK Minimap Scoreboard Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: rgba(0, 0, 0, 0); margin: 0; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        
        .minimap-scoreboard {
            width: 320px;
            background: rgba(15, 17, 21, 0.92);
            border: 2px solid #2c2d33;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 28px), calc(100% - 35px) 100%, 35px 100%, 0 calc(100% - 28px));
            position: relative;
            transition: opacity 0.3s ease;
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');

            if (!roomId) {
                document.body.innerHTML = "<div style='color:white; padding:20px;'>방(room) 정보가 지정되지 않았습니다.</div>";
                return;
            }

            const roomRef = ref(db, `rooms/${roomId}`);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val() || {};
                let ms = data.matchState || {};
                
                // [표시 토글 제어] 콘솔에서 숨김으로 지정하면 오버레이 전체를 투명하게 만듦
                let scoreboardEl = document.getElementById('scoreboard-wrapper');
                if (ms.scoreVisible === false) {
                    scoreboardEl.style.opacity = '0';
                    scoreboardEl.style.pointerEvents = 'none';
                    return;
                } else {
                    scoreboardEl.style.opacity = '1';
                    scoreboardEl.style.pointerEvents = 'auto';
                }

                let teamNames = ms.teamNames || { team1: "1팀", team2: "2팀", team1Color: "#1d3557", team2Color: "#6a1b1b" };
                let t1Name = teamNames.team1 || "1팀";
                let t2Name = teamNames.team2 || "2팀";
                let t1Color = teamNames.team1Color || "#1d3557";
                let t2Color = teamNames.team2Color || "#6a1b1b";

                document.getElementById('t1-name').innerText = t1Name;
                document.getElementById('t2-name').innerText = t2Name;
                document.getElementById('t1-box').style.backgroundColor = t1Color;
                document.getElementById('t2-box').style.backgroundColor = t2Color;

                document.getElementById('p1Score').innerText = ms.p1Score !== undefined ? ms.p1Score : 0;
                document.getElementById('p2Score').innerText = ms.p2Score !== undefined ? ms.p2Score : 0;

                let activeSetName = "1세트";
                let currentP1Player = "-";
                let currentP2Player = "-";

                if (ms.matchSetsObj) {
                    let setsArray = Object.values(ms.matchSetsObj);
                    if (setsArray.length > 0) {
                        let targetSet = setsArray[0];
                        activeSetName = targetSet.name.replace(" (매치)", "");
                        
                        if (targetSet.matches) {
                            let matchEntries = Object.values(targetSet.matches);
                            let activeMatch = matchEntries.find(m => m.t1Player && m.t1Player !== "미정") || matchEntries[0];
                            if (activeMatch) {
                                currentP1Player = activeMatch.t1Player !== "미정" ? activeMatch.t1Player : "-";
                                currentP2Player = activeMatch.t2Player !== "미정" ? activeMatch.t2Player : "-";
                            }
                        }
                    }
                }

                document.getElementById('set-title').innerText = `[${activeSetName}]`;
                document.getElementById('t1-player').innerText = currentP1Player;
                document.getElementById('t2-player').innerText = currentP2Player;
            });
        };
    </script>
</head>
<body class="flex items-start justify-start p-2">
    
    <div id="scoreboard-wrapper" class="minimap-scoreboard flex flex-col text-white font-sans overflow-hidden">
        <div class="bg-[#141518] border-b border-[#2c2d33] py-1 text-center flex items-center justify-center gap-2">
            <span id="set-title" class="text-[#00FFA3] text-xs font-black tracking-wider">[1세트]</span>
            <span class="text-gray-300 text-[11px] font-bold">스타크래프트 프로리그</span>
        </div>

        <div class="grid grid-cols-5 text-xs font-black text-center items-center h-8">
            <div id="t1-box" class="col-span-2 h-full flex items-center justify-center px-1 truncate text-white shadow" style="background-color: #1d3557;">
                <span id="t1-name" class="truncate">TEAM 이름</span>
            </div>
            <div class="col-span-1 bg-[#1b1c20] text-[#00FFA3] text-sm font-black h-full flex items-center justify-center border-x border-[#2c2d33]">
                <span id="p1Score">0</span>
                <span class="text-gray-500 mx-0.5">:</span>
                <span id="p2Score">0</span>
            </div>
            <div id="t2-box" class="col-span-2 h-full flex items-center justify-center px-1 truncate text-white shadow" style="background-color: #6a1b1b;">
                <span id="t2-name" class="truncate">TEAM 이름</span>
            </div>
        </div>

        <div class="grid grid-cols-2 text-xs font-bold text-center items-center h-7 bg-[#0b0c0e] border-t border-[#2c2d33]">
            <div class="h-full flex items-center justify-center px-1 truncate text-blue-300 border-r border-[#2c2d33]">
                <span id="t1-player" class="truncate">홍길동</span>
            </div>
            <div class="h-full flex items-center justify-center px-1 truncate text-red-300">
                <span id="t2-player" class="truncate">홍길동</span>
            </div>
        </div>
    </div>

</body>
</html>
