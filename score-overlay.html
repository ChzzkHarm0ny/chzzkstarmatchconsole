<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CHZZK Minimap Scoreboard Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: rgba(0, 0, 0, 0); margin: 0; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        
        .minimap-scoreboard {
            width: 275px;
            height: 98px;
            background: rgba(15, 17, 21, 0.98);
            border: 2px solid #3c3d44;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            clip-path: polygon(
                0 0, 
                100% 0, 
                100% 100%, 
                80% 100%,
                68% calc(100% - 42px),
                32% calc(100% - 42px),
                20% 100%,
                0 100%
            );
            position: relative;
        }

        .player-footer {
            position: absolute;
            bottom: 2px;
            left: 0;
            right: 0;
            height: 26px;
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
            font-weight: 900;
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let playerRaceMap = {};

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');

            if (!roomId) return;

            const roomRef = ref(db, "rooms/" + roomId);
            onValue(roomRef, async (snapshot) => {
                const data = snapshot.val() || {};
                
                if (data.settings && data.settings.gasUrl) {
                    try {
                        let res = await fetch(data.settings.gasUrl + "?action=getData");
                        let sheetData = await res.json();
                        if (sheetData.players) {
                            sheetData.players.forEach(p => { playerRaceMap[p.name] = p.race; });
                        }
                    } catch (e) {}
                }

                let ms = data.matchState || {};
                let scoreboardEl = document.getElementById('scoreboard-wrapper');
                if (ms.scoreVisible === false) {
                    scoreboardEl.style.opacity = '0';
                    return;
                } else {
                    scoreboardEl.style.opacity = '1';
                }

                document.getElementById('league-title').innerText = ms.leagueTitle || "대회이름";
                
                let teamNames = ms.teamNames || { team1: "선수1", team2: "선수2", team1Color: "#1d3557", team2Color: "#6a1b1b" };
                document.getElementById('t1-name').innerText = teamNames.team1;
                document.getElementById('t2-name').innerText = teamNames.team2;
                document.getElementById('t1-box').style.backgroundColor = teamNames.team1Color;
                document.getElementById('t2-box').style.backgroundColor = teamNames.team2Color;

                document.getElementById('p1Score').innerText = ms.p1Score !== undefined ? ms.p1Score : 0;
                document.getElementById('p2Score').innerText = ms.p2Score !== undefined ? ms.p2Score : 0;

                let t1Players = ["-"];
                let t2Players = ["-"];

                if (ms.matchSetsObj) {
                    let setsArray = Object.values(ms.matchSetsObj);
                    if (setsArray.length > 0) {
                        let targetSet = setsArray[0];
                        let activeIdx = targetSet.activeMatchIdx || 1;
                        if (targetSet.matches && targetSet.matches[activeIdx]) {
                            let activeMatch = targetSet.matches[activeIdx];
                            t1Players = activeMatch.t1Players || [activeMatch.t1Player];
                            t2Players = activeMatch.t2Players || [activeMatch.t2Player];
                        }
                    }
                }

                let scorePos = ms.scorePos || { t1Pos: "", t2Pos: "" };
                let p1Text = t1Players.map(p => formatPlayerDisplay(p, scorePos.t1Pos)).join(', ');
                let p2Text = t2Players.map(p => formatPlayerDisplay(p, scorePos.t2Pos)).join(', ');

                let t1El = document.getElementById('t1-player');
                let t2El = document.getElementById('t2-player');
                t1El.innerText = p1Text;
                t2El.innerText = p2Text;
                
                // 다대다 팀전일 경우 공간 확보를 위해 폰트 축소
                t1El.style.fontSize = t1Players.length > 1 ? "10px" : "13px";
                t2El.style.fontSize = t2Players.length > 1 ? "10px" : "13px";
            });
        };

        function formatPlayerDisplay(name, pos) {
            if (!name || name === "미정" || name === "-") return "-";
            let raceFull = playerRaceMap[name] || "";
            let raceInitial = raceFull === "프로토스" ? "P" : (raceFull === "테란" ? "T" : (raceFull === "저그" ? "Z" : ""));
            let badge = (pos ? pos : "") + raceInitial;
            return badge ? `${name}(${badge})` : name;
        }
    </script>
</head>
<body class="flex items-start justify-start p-0">
    <div id="scoreboard-wrapper" class="minimap-scoreboard flex flex-col text-white font-sans">
        <div class="bg-[#141518] border-b border-[#2c2d33] py-0.5 px-2 text-center">
            <span id="league-title" class="text-[#00FFA3] text-xs font-black tracking-wider">대회이름</span>
        </div>
        <div class="grid grid-cols-5 text-sm font-black text-center items-center h-8">
            <div id="t1-box" class="col-span-2 h-full flex items-center justify-center px-1 truncate text-white shadow" style="background-color: #1d3557;">
                <span id="t1-name" class="truncate text-xs font-black">선수1</span>
            </div>
            <div class="col-span-1 bg-[#1b1c20] text-[#00FFA3] text-sm font-black h-full flex items-center justify-center border-x border-[#2c2d33]">
                <span id="p1Score">0</span>
                <span class="text-gray-500 mx-0.5">-</span>
                <span id="p2Score">0</span>
            </div>
            <div id="t2-box" class="col-span-2 h-full flex items-center justify-center px-1 truncate text-white shadow" style="background-color: #6a1b1b;">
                <span id="t2-name" class="truncate text-xs font-black">선수2</span>
            </div>
        </div>
        <div class="player-footer flex items-end">
            <div class="w-[85px] text-left truncate text-blue-300 pl-1 pb-1">
                <span id="t1-player">-</span>
            </div>
            <div class="w-[85px] text-right truncate text-red-300 pr-1 pb-1">
                <span id="t2-player">-</span>
            </div>
        </div>
    </div>
</body>
</html>
