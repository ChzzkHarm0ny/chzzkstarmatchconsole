<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CHZZK Minimap Scoreboard Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: rgba(0, 0, 0, 0); margin: 0; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        
        .minimap-scoreboard {
            width: 320px;
            height: 112px; 
            background: transparent;
            border: 2px solid #3c3d44;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            clip-path: polygon(
                0% 0%, 
                100% 0%, 
                100% 100%, 
                78% 100%, 
                68% 58%, 
                32% 58%, 
                22% 100%, 
                0% 100%
            );
            position: relative;
        }

        /* 양쪽 다리(Leg) 영역을 위/아래 공간으로 나누어 선수와 위치를 깔끔하게 배치 */
        .leg-left {
            position: absolute;
            bottom: 4px;
            left: 8px;
            width: 90px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 2px;
        }
        
        .leg-right {
            position: absolute;
            bottom: 4px;
            right: 8px;
            width: 90px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            gap: 2px;
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let playerRaceMap = {};

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');

            if (!roomId) return;

            const roomRef = ref(db, "rooms/" + roomId);
            onValue(roomRef, async (snapshot) => {
                const data = snapshot.val() || {};
                
                if (data.settings && data.settings.gasUrl) {
                    try {
                        let res = await fetch(data.settings.gasUrl + "?action=getData");
                        let sheetData = await res.json();
                        if (sheetData.players) {
                            sheetData.players.forEach(p => { playerRaceMap[p.name] = p.race; });
                        }
                    } catch (e) {}
                }

                let ms = data.matchState || {};
                let scoreboardEl = document.getElementById('scoreboard-wrapper');
                if (ms.scoreVisible === false) {
                    scoreboardEl.style.opacity = '0';
                    return;
                } else {
                    scoreboardEl.style.opacity = '1';
                }

                // 1. 대회/세트 이름 렌더링
                document.getElementById('league-title').innerText = ms.leagueTitle || "대회이름";
                
                let teamNames = ms.teamNames || { team1: "1팀", team2: "2팀", team1Color: "#1d3557", team2Color: "#6a1b1b" };
                document.getElementById('t1-box').style.backgroundColor = teamNames.team1Color;
                document.getElementById('t2-box').style.backgroundColor = teamNames.team2Color;

                document.getElementById('p1Score').innerText = ms.p1Score !== undefined ? ms.p1Score : 0;
                document.getElementById('p2Score').innerText = ms.p2Score !== undefined ? ms.p2Score : 0;

                let t1Players = ["-"];
                let t2Players = ["-"];

                if (ms.matchSetsObj) {
                    let setsArray = Object.values(ms.matchSetsObj);
                    if (setsArray.length > 0) {
                        let targetSet = setsArray[0];
                        let activeIdx = targetSet.activeMatchIdx || 1;
                        if (targetSet.matches && targetSet.matches[activeIdx]) {
                            let activeMatch = targetSet.matches[activeIdx];
                            t1Players = activeMatch.t1Players || [activeMatch.t1Player];
                            t2Players = activeMatch.t2Players || [activeMatch.t2Player];
                        }
                    }
                }

                let scorePos = ms.scorePos || { t1Pos: "", t2Pos: "" };
                let pos1Text = scorePos.t1Pos ? `${scorePos.t1Pos}` : "";
                let pos2Text = scorePos.t2Pos ? `${scorePos.t2Pos}` : "";
                
                let t1PlayersRaw = t1Players.filter(p => p !== "-" && p !== "미정");
                let t2PlayersRaw = t2Players.filter(p => p !== "-" && p !== "미정");

                let isSoloMode = (ms.matchMode === 'solo');

                if (isSoloMode) {
                    // [개인전 모드] 
                    // 1) 상단 컬러 박스에 팀명 대신 '선수명' 기입
                    document.getElementById('t1-name').innerText = t1PlayersRaw[0] || "선수1";
                    document.getElementById('t2-name').innerText = t2PlayersRaw[0] || "선수2";
                    
                    // 2) 하단 공간에 선수명단은 지우고 위치+종족 표기
                    document.getElementById('t1-players').innerHTML = "";
                    document.getElementById('t2-players').innerHTML = "";

                    let r1 = playerRaceMap[t1PlayersRaw[0]] || "";
                    let r1Initial = r1 === "프로토스" ? "(P)" : (r1 === "테란" ? "(T)" : (r1 === "저그" ? "(Z)" : ""));
                    let r2 = playerRaceMap[t2PlayersRaw[0]] || "";
                    let r2Initial = r2 === "프로토스" ? "(P)" : (r2 === "테란" ? "(T)" : (r2 === "저그" ? "(Z)" : ""));

                    document.getElementById('t1-pos').innerText = pos1Text ? `${pos1Text} ${r1Initial}` : r1Initial;
                    document.getElementById('t2-pos').innerText = pos2Text ? `${pos2Text} ${r2Initial}` : r2Initial;

                } else {
                    // [팀전 모드]
                    // 1) 상단 컬러 박스에 '팀명' 기입
                    document.getElementById('t1-name').innerText = teamNames.team1;
                    document.getElementById('t2-name').innerText = teamNames.team2;
                    
                    // 2) 하단 공간에 이름(종족) 포맷팅 후 2명씩 묶어서 세로 나열
                    let p1Formatted = t1PlayersRaw.map(p => formatPlayerDisplay(p));
                    let p2Formatted = t2PlayersRaw.map(p => formatPlayerDisplay(p));

                    let fontSize = p1Formatted.length > 2 ? '11px' : '12px';
                    
                    let p1Html = chunkArray(p1Formatted, 2).map(txt => `<div class="truncate text-blue-300 w-full text-left" style="font-size: ${fontSize}; font-weight: 900; line-height: 1.25; text-shadow: 1px 1px 2px black;">${txt}</div>`).join('');
                    let p2Html = chunkArray(p2Formatted, 2).map(txt => `<div class="truncate text-red-300 w-full text-right" style="font-size: ${fontSize}; font-weight: 900; line-height: 1.25; text-shadow: 1px 1px 2px black;">${txt}</div>`).join('');

                    document.getElementById('t1-players').innerHTML = p1Html;
                    document.getElementById('t2-players').innerHTML = p2Html;

                    // 3) 맨 아랫줄에 시작 위치 표기
                    document.getElementById('t1-pos').innerText = pos1Text;
                    document.getElementById('t2-pos').innerText = pos2Text;
                }
            });
        };

        function chunkArray(arr, size) {
            let result = [];
            for (let i = 0; i < arr.length; i += size) {
                result.push(arr.slice(i, i + size).join(', '));
            }
            return result;
        }

        // 팀전일 경우 선수명(종족) 포맷 리턴
        function formatPlayerDisplay(name) {
            if (!name) return "";
            let raceFull = playerRaceMap[name] || "";
            let raceInitial = raceFull === "프로토스" ? "P" : (raceFull === "테란" ? "T" : (raceFull === "저그" ? "Z" : ""));
            return raceInitial ? `${name}(${raceInitial})` : name;
        }
    </script>
</head>
<body class="flex items-start justify-start p-0">
    <div id="scoreboard-wrapper" class="minimap-scoreboard flex flex-col text-white font-sans bg-[#1b1c20]">
        
        <!-- 1. 대회 이름 / 세트 -->
        <div class="bg-[#141518] border-b border-[#2c2d33] h-[22px] flex items-center justify-center shrink-0">
            <span id="league-title" class="text-[#00FFA3] text-[12px] font-black tracking-wider">대회이름</span>
        </div>
        
        <!-- 2. 팀명(또는 솔로일시 선수명) 및 스코어 -->
        <div class="grid grid-cols-[1fr_60px_1fr] h-[34px] text-sm font-black text-center items-center shrink-0 border-b border-[#2c2d33]">
            <div id="t1-box" class="h-full flex items-center justify-center px-1 truncate shadow text-white" style="background-color: #1d3557;">
                <span id="t1-name" class="truncate text-[13px] font-black drop-shadow-md">1팀</span>
            </div>
            <div class="bg-[#1b1c20] text-[#00FFA3] text-[14px] font-black h-full flex items-center justify-center border-x border-[#2c2d33]">
                <span id="p1Score">0</span><span class="mx-1 text-gray-500">-</span><span id="p2Score">0</span>
            </div>
            <div id="t2-box" class="h-full flex items-center justify-center px-1 truncate shadow text-white" style="background-color: #6a1b1b;">
                <span id="t2-name" class="truncate text-[13px] font-black drop-shadow-md">2팀</span>
            </div>
        </div>
        
        <!-- 3 & 4. 선수 명단 및 위치 (하단 영역) -->
        <div class="flex-grow relative bg-[#0b0c0e]">
            
            <!-- 왼쪽 팀 공간 -->
            <div class="leg-left">
                <!-- 선수 명단 렌더링 컨테이너 -->
                <div id="t1-players" class="w-full"></div>
                <!-- 하단 시작 위치 텍스트 -->
                <div id="t1-pos" class="text-yellow-400 text-[12px] font-black w-full text-left tracking-wider" style="text-shadow: 1px 1px 2px black;"></div>
            </div>
            
            <!-- 오른쪽 팀 공간 -->
            <div class="leg-right">
                <!-- 선수 명단 렌더링 컨테이너 -->
                <div id="t2-players" class="w-full"></div>
                <!-- 하단 시작 위치 텍스트 -->
                <div id="t2-pos" class="text-yellow-400 text-[12px] font-black w-full text-right tracking-wider" style="text-shadow: 1px 1px 2px black;"></div>
            </div>
            
        </div>
    </div>
</body>
</html>
