<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CHZZK Minimap Scoreboard Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: rgba(0, 0, 0, 0); margin: 0; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        
        .minimap-scoreboard {
            width: 320px;
            height: 112px; 
            background: transparent;
            border: 2px solid #3c3d44;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            
            /* 사다리꼴 파임 높이 35px 고정 */
            clip-path: polygon(
                0% 0%, 
                100% 0%, 
                100% 100%, 
                76% 100%, 
                68% calc(100% - 35px), 
                32% calc(100% - 35px), 
                24% 100%, 
                0% 100%
            );
            position: relative;
        }

        .leg-left {
            position: absolute;
            bottom: 4px;
            left: 6px;
            width: 86px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 2px;
        }
        
        .leg-right {
            position: absolute;
            bottom: 4px;
            right: 6px;
            width: 86px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            gap: 2px;
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function renderTextFit(id, text, defaultSize) {
            let el = document.getElementById(id);
            el.innerText = text;
            el.style.whiteSpace = "nowrap";
            
            let len = text.length;
            if (len >= 18) {
                el.style.fontSize = (defaultSize - 2) + "px";
                el.style.letterSpacing = "-1px";
                el.style.transform = "scaleX(0.75)";
            } else if (len >= 12) {
                el.style.fontSize = (defaultSize - 1.5) + "px";
                el.style.letterSpacing = "-0.5px";
                el.style.transform = "scaleX(0.85)";
            } else if (len >= 8) {
                el.style.fontSize = (defaultSize - 0.5) + "px";
                el.style.letterSpacing = "0px";
                el.style.transform = "scaleX(0.95)";
            } else {
                el.style.fontSize = defaultSize + "px";
                el.style.letterSpacing = "normal";
                el.style.transform = "scaleX(1)";
            }
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');

            if (!roomId) return;

            const roomRef = ref(db, "rooms/" + roomId);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val() || {};
                let ms = data.matchState || {};
                
                let scoreboardEl = document.getElementById('scoreboard-wrapper');
                if (ms.scoreVisible === false) {
                    scoreboardEl.style.opacity = '0';
                    return;
                } else {
                    scoreboardEl.style.opacity = '1';
                }

                let manual = data.manualScore || {
                    showTitle: true, showTeam: true, showTeamScore: true, showPlayer: true, showPlayerScore: true, showBottom: true,
                    title: "[1세트]", 
                    t1Name: "1팀", t1Score: 0, t2Score: 0, t2Name: "2팀",
                    p1Name: "선수1", p1Score: 0, p2Score: 0, p2Name: "선수2",
                    pos1: "", pos2: ""
                };

                let teamNames = ms.teamNames || { team1Color: "#1d3557", team2Color: "#6a1b1b" };

                // 1. 공지 표시 여부
                document.getElementById('row-title').style.display = manual.showTitle ? 'flex' : 'none';

                // 2. 팀 로우 전체 표시 여부
                let rowTeam = document.getElementById('row-team');
                if (manual.showTeam === false) {
                    rowTeam.style.display = 'none';
                } else {
                    rowTeam.style.display = 'grid';
                    // 팀명 숨김 여부
                    document.getElementById('bg-team1').style.display = manual.showTeam ? 'flex' : 'none';
                    document.getElementById('bg-team2').style.display = manual.showTeam ? 'flex' : 'none';
                    // 팀 점수 숨김 여부 (이미지 레퍼런스처럼 점수 칸만 끄고 켤 수 있게 처리)
                    document.getElementById('bg-score-t1').style.display = (manual.showTeamScore !== false) ? 'flex' : 'none';
                    document.getElementById('bg-score-t2').style.display = (manual.showTeamScore !== false) ? 'flex' : 'none';
                    
                    // 팀 점수가 꺼지면 팀명 칸이 양옆으로 넓어지도록 그리드 템플릿 조정
                    if (manual.showTeamScore === false) {
                        rowTeam.style.gridTemplateColumns = '1fr 0px 0px 1fr';
                    } else {
                        rowTeam.style.gridTemplateColumns = '1fr 32px 32px 1fr';
                    }
                }

                // 3. 선수 로우 전체 표시 여부
                let rowPlayer = document.getElementById('row-player');
                if (manual.showPlayer === false) {
                    rowPlayer.style.display = 'none';
                } else {
                    rowPlayer.style.display = 'grid';
                    // 이름 숨김 여부
                    document.getElementById('bg-player1').style.display = manual.showPlayer ? 'flex' : 'none';
                    document.getElementById('bg-player2').style.display = manual.showPlayer ? 'flex' : 'none';
                    // 이름 점수 숨김 여부
                    document.getElementById('bg-score-p1').style.display = (manual.showPlayerScore !== false) ? 'flex' : 'none';
                    document.getElementById('bg-score-p2').style.display = (manual.showPlayerScore !== false) ? 'flex' : 'none';

                    if (manual.showPlayerScore === false) {
                        rowPlayer.style.gridTemplateColumns = '1fr 0px 0px 1fr';
                    } else {
                        rowPlayer.style.gridTemplateColumns = '1fr 32px 32px 1fr';
                    }
                }

                // 4. 하단 위치 표시 여부
                document.getElementById('row-bottom').style.display = manual.showBottom ? 'block' : 'none';

                // 색상 적용
                document.getElementById('bg-team1').style.backgroundColor = teamNames.team1Color;
                document.getElementById('bg-team2').style.backgroundColor = teamNames.team2Color;
                document.getElementById('bg-score-t1').style.backgroundColor = teamNames.team1Color;
                document.getElementById('bg-score-t2').style.backgroundColor = teamNames.team2Color;
                document.getElementById('bg-player1').style.backgroundColor = teamNames.team1Color;
                document.getElementById('bg-player2').style.backgroundColor = teamNames.team2Color;
                document.getElementById('bg-score-p1').style.backgroundColor = teamNames.team1Color;
                document.getElementById('bg-score-p2').style.backgroundColor = teamNames.team2Color;

                // 텍스트 주입
                renderTextFit('text-title', manual.title || "", 11);
                
                renderTextFit('text-team1', manual.t1Name || "", 12);
                document.getElementById('score-team1').innerText = manual.t1Score || "0";
                document.getElementById('score-team2').innerText = manual.t2Score || "0";
                renderTextFit('text-team2', manual.t2Name || "", 12);

                renderTextFit('text-player1', manual.p1Name || "", 11.5);
                document.getElementById('score-player1').innerText = manual.p1Score || "0";
                document.getElementById('score-player2').innerText = manual.p2Score || "0";
                renderTextFit('text-player2', manual.p2Name || "", 11.5);

                document.getElementById('text-pos1').innerText = manual.pos1 || "";
                document.getElementById('text-pos2').innerText = manual.pos2 || "";
            });
        };
    </script>
</head>
<body class="flex items-start justify-start p-0">
    <div id="scoreboard-wrapper" class="minimap-scoreboard flex flex-col text-white font-sans bg-[#1b1c20]">
        
        <!-- 1. 공지 (Title Row) -->
        <div id="row-title" class="bg-[#141518] border-b border-[#2c2d33] h-[22px] flex items-center justify-center shrink-0 overflow-hidden">
            <span id="text-title" class="text-[#00FFA3] font-black tracking-wider drop-shadow-md origin-center transition-all"></span>
        </div>
        
        <!-- 2. 팀 로우 (Team Row) -->
        <div id="row-team" class="grid grid-cols-[1fr_32px_32px_1fr] flex-1 font-black text-center items-center shrink-0 border-b border-[#2c2d33]">
            <div id="bg-team1" class="relative h-full flex items-center justify-center px-1 overflow-hidden shadow text-white">
                <span id="text-team1" class="relative z-10 font-black drop-shadow-md origin-center transition-all"></span>
            </div>
            
            <div id="bg-score-t1" class="relative h-full flex items-center justify-center border-r border-[#1b1c20]">
                <div class="absolute inset-0 bg-black/30"></div>
                <span id="score-team1" class="relative z-10 text-white text-[14px] font-black drop-shadow-md">0</span>
            </div>
            
            <div id="bg-score-t2" class="relative h-full flex items-center justify-center border-l border-[#1b1c20]">
                <div class="absolute inset-0 bg-black/30"></div>
                <span id="score-team2" class="relative z-10 text-white text-[14px] font-black drop-shadow-md">0</span>
            </div>
            
            <div id="bg-team2" class="relative h-full flex items-center justify-center px-1 overflow-hidden shadow text-white">
                <span id="text-team2" class="relative z-10 font-black drop-shadow-md origin-center transition-all"></span>
            </div>
        </div>

        <!-- 3. 선수 로우 (Player Row) -->
        <div id="row-player" class="grid grid-cols-[1fr_32px_32px_1fr] flex-1 font-black text-center items-center shrink-0 border-b border-[#2c2d33]">
            <div id="bg-player1" class="relative h-full flex items-center justify-center px-1 overflow-hidden shadow text-gray-200">
                <div class="absolute inset-0 bg-black/30"></div>
                <span id="text-player1" class="relative z-10 font-black drop-shadow-md origin-center transition-all"></span>
            </div>
            
            <div id="bg-score-p1" class="relative h-full flex items-center justify-center border-r border-[#1b1c20]">
                <div class="absolute inset-0 bg-black/50"></div>
                <span id="score-player1" class="relative z-10 text-gray-100 text-[13px] font-black drop-shadow-md">0</span>
            </div>
            
            <div id="bg-score-p2" class="relative h-full flex items-center justify-center border-l border-[#1b1c20]">
                <div class="absolute inset-0 bg-black/50"></div>
                <span id="score-player2" class="relative z-10 text-gray-100 text-[13px] font-black drop-shadow-md">0</span>
            </div>
            
            <div id="bg-player2" class="relative h-full flex items-center justify-center px-1 overflow-hidden shadow text-gray-200">
                <div class="absolute inset-0 bg-black/30"></div>
                <span id="text-player2" class="relative z-10 font-black drop-shadow-md origin-center transition-all"></span>
            </div>
        </div>
        
        <!-- 4. 하단 위치 (Bottom Row) -->
        <div id="row-bottom" class="h-[24px] shrink-0 relative bg-[#0b0c0e]">
            <div class="leg-left">
                <div id="text-pos1" class="text-[#00FFA3] text-[12px] font-black w-full text-left tracking-wider" style="text-shadow: 1px 1px 2px black;"></div>
            </div>
            <div class="leg-right">
                <div id="text-pos2" class="text-[#00FFA3] text-[12px] font-black w-full text-right tracking-wider" style="text-shadow: 1px 1px 2px black;"></div>
            </div>
        </div>

    </div>
</body>
</html>
