    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, update, onValue, remove, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // ... (이전 코드와 동일한 firebaseConfig 및 변수 선언)
        const ROOM_AUTH_URL = "https://script.google.com/macros/s/AKfycbwFSMBiDHsY0Ap_wWtUFuRhA12Os8N_JBMebIbv9cHpzHND0tJHbIxXQlc1re7_MXWT/exec";
        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let allPlayers = [], allMaps = [], currentRoomId = null, userGasUrl = "", selectedRoster = [], team1Roster = [], team2Roster = [], selectedMapPool = [];
        let matchSetsObj = { 1: { id: 1, name: "1세트 (프로리그)", matchesCount: 7, matches: {}, nameCustom: false } };
        let activeSetId = 1, currentMatchMode = "team", team1Name = "1팀", team2Name = "2팀", team1Color = "#1d3557", team2Color = "#6a1b1b";
        let player1Color = "#0C48CC", player2Color = "#F40404", player1TextColor = "#ffffff", player2TextColor = "#ffffff", leagueTitleText = "스타크래프트 프로리그";

        // ... (중간 코드: verifyMasterKeyOnServer, getJosaRo, toggleThemeMode 등 이전과 동일하게 유지)

        // 💡 핵심 수정: 경기 정보(matchTitle)를 오버레이로 전달하도록 수정된 함수
        window.saveVsMatchState = function(isAutoSend = false) {
            if (!currentRoomId) return;
            let val = document.getElementById('vs-match-select').value;
            if(!val) { 
                if(!isAutoSend) alert("목록에서 경기를 먼저 선택해주세요!"); 
                return; 
            }
            let parts = val.split('-');
            let setId = parts[0];
            let matchIdx = parts[1];
            let setObj = matchSetsObj[setId];
            let m = setObj?.matches[matchIdx];
            if(!m) return;

            let t1Players = m.t1Players || [m.t1Player || "미정"];
            let t2Players = m.t2Players || [m.t2Player || "미정"];

            let githubBase = "https://raw.githubusercontent.com/ChzzkHarm0ny/SZD/main/images/";
            
            let t1DataArr = t1Players.map(name => {
                if(name === "-") return { name: "-", race: "-", img: "" };
                let obj = allPlayers.find(p => p.name === name) || { name: name, race: "미정", img: githubBase + encodeURIComponent(name) + ".png" };
                return { name: obj.name, race: obj.race, img: obj.img };
            });
            let t2DataArr = t2Players.map(name => {
                if(name === "-") return { name: "-", race: "-", img: "" };
                let obj = allPlayers.find(p => p.name === name) || { name: name, race: "미정", img: githubBase + encodeURIComponent(name) + ".png" };
                return { name: obj.name, race: obj.race, img: obj.img };
            });
            let mapObj = allMaps.find(map => map.name === m.mapName) || { name: m.mapName, url: "" };

            // [수정 포인트] 경기 라벨 데이터를 조합하여 추가
            let matchTitleStr = (setObj ? setObj.name : "") + " " + matchIdx + "경기";

            let vsData = {
                t1: t1DataArr,
                t2: t2DataArr,
                map: { name: mapObj.name, url: mapObj.url || "" },
                matchTitle: matchTitleStr, // 👈 VS 오버레이가 읽을 키
                timestamp: Date.now()
            };

            set(ref(db, "rooms/" + currentRoomId + "/matchState/vsMatch"), vsData);
            
            let p1Text = t1Players.filter(x => x !== "-" && x !== "미정").join(', ') || "미정";
            let p2Text = t2Players.filter(x => x !== "-" && x !== "미정").join(', ') || "미정";
            let t1ImgName = t1Players.find(x => x !== "-" && x !== "미정") || "선수1";
            let t2ImgName = t2Players.find(x => x !== "-" && x !== "미정") || "선수2";

            updateVsPreview(t1ImgName, t2ImgName, m.mapName, p1Text, p2Text);
            
            // 수동 스코어보드 연동
            document.getElementById('man-title').value = "[" + matchTitleStr + "]";
            document.getElementById('man-p1-name').value = p1Text;
            document.getElementById('man-p2-name').value = p2Text;
            saveManualScoreboard();

            alert("경기 정보가 VS 매치업 화면에 성공적으로 송출되었습니다!");
        }

        // ... (이후 나머지 함수들 모두 동일하게 유지)
    </script>
