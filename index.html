<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CHZZK StarCraft Console</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // 파이어베이스 설정 정보
        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 구글 Apps Script 웹 앱 URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbybnHDjngVQxjsY-VEwPC2Jynqylhqy2m7x7Ft8SXZtw4PSK4pXi9EIU4OfMbdsRxUDrg/exec";

        let allPlayers = [];
        let allMaps = [];

        window.onload = async function() {
            generateOverlayUrls();

            try {
                let res = await fetch(GAS_URL + "?action=getData");
                let data = await res.json();
                allPlayers = data.players || [];
                allMaps = data.maps || [];
                
                initMatchTable();
                initVsSelectors();
            } catch (e) {
                console.error("스프레드시트 데이터 로드 실패:", e);
            }

            document.getElementById('btn-copy-url').addEventListener('click', () => copyUrl('overlay-url-input', 'btn-copy-url'));
            document.getElementById('btn-copy-vs-url').addEventListener('click', () => copyUrl('vs-url-input', 'btn-copy-vs-url'));
            
            document.getElementById('btn-save-teams').addEventListener('click', saveTeamNames);
            document.getElementById('btn-save-match').addEventListener('click', saveMatchState);
            document.getElementById('btn-save-vs').addEventListener('click', saveVsMatchState);
            
            document.getElementById('btn-p1-plus').addEventListener('click', () => updateScore('p1Score', 1));
            document.getElementById('btn-p1-minus').addEventListener('click', () => updateScore('p1Score', -1));
            document.getElementById('btn-p2-plus').addEventListener('click', () => updateScore('p2Score', 1));
            document.getElementById('btn-p2-minus').addEventListener('click', () => updateScore('p2Score', -1));
        };

        // 7세트 대진표 표 동적 생성
        function initMatchTable() {
            const tbody = document.getElementById('match-table-body');
            tbody.innerHTML = '';

            for (let i = 1; i <= 7; i++) {
                let tr = document.createElement('tr');
                tr.className = "border-b border-[#2c2d33] text-center";
                
                tr.innerHTML = `
                    <td class="p-2 font-bold text-gray-400">${i}세트</td>
                    <td class="p-2">
                        <select id="t1-player-${i}" class="w-full bg-[#0b0c0e] border border-[#2c2d33] rounded p-1 text-xs text-white">
                            <option value="">재호팀 선수 선택</option>
                        </select>
                    </td>
                    <td class="p-2">
                        <select id="map-${i}" class="w-full bg-[#0b0c0e] border border-[#2c2d33] rounded p-1 text-xs text-white">
                            <option value="">맵 선택</option>
                        </select>
                    </td>
                    <td class="p-2">
                        <select id="t2-player-${i}" class="w-full bg-[#0b0c0e] border border-[#2c2d33] rounded p-1 text-xs text-white">
                            <option value="">상대팀 선수 선택</option>
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);

                let t1Sel = document.getElementById(`t1-player-${i}`);
                let t2Sel = document.getElementById(`t2-player-${i}`);
                let mapSel = document.getElementById(`map-${i}`);

                allPlayers.forEach(p => {
                    t1Sel.add(new Option(`${p.name} (${p.race})`, p.name));
                    t2Sel.add(new Option(`${p.name} (${p.race})`, p.name));
                });

                allMaps.forEach(m => {
                    mapSel.add(new Option(m.name, m.name));
                });
            }
        }

        // VS 매치업 셀렉트박스 채우기
        function initVsSelectors() {
            let vsT1 = document.getElementById('vs-t1-player');
            let vsT2 = document.getElementById('vs-t2-player');
            let vsMap = document.getElementById('vs-map');

            allPlayers.forEach(p => {
                vsT1.add(new Option(`${p.name} (${p.race})`, p.name));
                vsT2.add(new Option(`${p.name} (${p.race})`, p.name));
            });

            allMaps.forEach(m => {
                vsMap.add(new Option(m.name, m.name));
            });
        }

        // 팀 이름 저장
        function saveTeamNames() {
            let team1Name = document.getElementById('input-team1-name').value || "1팀";
            let team2Name = document.getElementById('input-team2-name').value || "2팀";

            set(ref(db, 'matchState/teamNames'), {
                team1: team1Name,
                team2: team2Name
            });
            alert("팀 이름이 적용되었습니다!");
        }

        // 1~7세트 대진표 저장
        function saveMatchState() {
            let matches = {};
            for (let i = 1; i <= 7; i++) {
                matches[i] = {
                    t1Player: document.getElementById(`t1-player-${i}`).value || "미정",
                    t2Player: document.getElementById(`t2-player-${i}`).value || "미정",
                    mapName: document.getElementById(`map-${i}`).value || "미정"
                };
            }

            let activeSet = document.getElementById('active-set').value;

            set(ref(db, 'matchState'), {
                p1Score: parseInt(document.getElementById('p1Score').innerText),
                p2Score: parseInt(document.getElementById('p2Score').innerText),
                currentActiveSet: activeSet,
                matches: matches
            });
            alert("전체 1~7세트 대진표가 오버레이에 반영되었습니다!");
        }

        // VS 매치업 화면 저장
        function saveVsMatchState() {
            let t1PlayerName = document.getElementById('vs-t1-player').value;
            let t2PlayerName = document.getElementById('vs-t2-player').value;
            let mapName = document.getElementById('vs-map').value;

            let t1Obj = allPlayers.find(p => p.name === t1PlayerName) || { name: t1PlayerName, race: "미정", img: "" };
            let t2Obj = allPlayers.find(p => p.name === t2PlayerName) || { name: t2PlayerName, race: "미정", img: "" };
            let mapObj = allMaps.find(m => m.name === mapName) || { name: mapName, url: "" };

            let vsData = {
                t1: { name: t1Obj.name, race: t1Obj.race, img: t1Obj.img || "" },
                t2: { name: t2Obj.name, race: t2Obj.race, img: t2Obj.img || "" },
                map: { name: mapObj.name, url: mapObj.url || "" }
            };

            set(ref(db, 'matchState/vsMatch'), vsData);
            alert("VS 매치업 오버레이에 적용되었습니다!");
        }

        function generateOverlayUrls() {
            const currentUrl = window.location.href;
            const baseUrl = currentUrl.replace(/index\.html$/, '').replace(/\/$/, '');
            document.getElementById('overlay-url-input').value = baseUrl + '/overlay.html';
            document.getElementById('vs-url-input').value = baseUrl + '/vs-overlay.html';
        }

        function copyUrl(inputId, btnId) {
            const urlInput = document.getElementById(inputId);
            urlInput.select();
            navigator.clipboard.writeText(urlInput.value).then(() => {
                const btn = document.getElementById(btnId);
                const originalText = btn.innerText;
                btn.innerText = '복사 완료!';
                setTimeout(() => btn.innerText = originalText, 2000);
            });
        }

        function updateScore(targetField, delta) {
            const scoreDisplay = document.getElementById(targetField);
            let currentScore = parseInt(scoreDisplay.innerText) + delta;
            if (currentScore < 0) currentScore = 0;
            set(ref(db, 'matchState/' + targetField), currentScore);
        }

        onValue(ref(db, 'matchState'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if(data.p1Score !== undefined) document.getElementById('p1Score').innerText = data.p1Score;
                if(data.p2Score !== undefined) document.getElementById('p2Score').innerText = data.p2Score;
                if(data.teamNames) {
                    if(document.getElementById('input-team1-name').value === "1팀") document.getElementById('input-team1-name').value = data.teamNames.team1;
                    if(document.getElementById('input-team2-name').value === "2팀") document.getElementById('input-team2-name').value = data.teamNames.team2;
                }
            }
        });
    </script>
</head>
<body class="bg-[#0b0c0e] text-white p-6 font-sans">
    <div class="max-w-4xl mx-auto bg-[#141518] p-6 rounded-2xl border border-[#2c2d33] shadow-2xl">
        <h1 class="text-xl font-bold mb-6 flex items-center justify-between border-b border-[#2c2d33] pb-4">
            <span class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-[#00FFA3] animate-pulse"></span>
                CHZZK STARCRAFT CONSOLE
            </span>
            <span class="text-xs bg-[#00FFA3]/10 text-[#00FFA3] border border-[#00FFA3]/30 px-3 py-1 rounded-full font-semibold">PROLEAGUE MODE</span>
        </h1>

        <!-- 🏷️ 팀 이름 커스텀 설정 패널 -->
        <div class="mb-6 bg-[#1b1c20] p-4 rounded-xl border border-[#2c2d33]">
            <h3 class="text-sm font-bold text-[#00FFA3] mb-2">팀 이름 커스텀 설정</h3>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">팀 1 이름</label>
                    <input type="text" id="input-team1-name" value="1팀" class="w-full bg-[#0b0c0e] border border-[#2c2d33] rounded p-2 text-xs text-white">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">팀 2 이름</label>
                    <input type="text" id="input-team2-name" value="2팀" class="w-full bg-[#0b0c0e] border border-[#2c2d33] rounded p-2 text-xs text-white">
                </div>
            </div>
            <button id="btn-save-teams" class="w-full bg-[#2c2d33] hover:bg-[#3c3d44] text-white font-bold py-1.5 rounded-lg text-xs transition-all cursor-pointer">
                팀 이름 적용하기
            </button>
        </div>

        <!-- OBS 오버레이 링크 복사 패널 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-[#1b1c20] p-4 rounded-xl border border-[#2c2d33]">
                <label class="block text-[10px] font-bold text-gray-400 mb-2">프로리그 대진표 오버레이 링크</label>
                <div class="flex gap-2">
                    <input type="text" id="overlay-url-input" readonly class="w-full bg-[#0b0c0e] border border-[#2c2d33] rounded px-2 py-1 text-xs text-gray-300">
                    <button id="btn-copy-url" class="bg-[#00FFA3] hover:bg-[#00e692] text-black px-3 py-1 rounded text-xs font-bold whitespace-nowrap cursor-pointer">복사</button>
                </div>
            </div>
            <div class="bg-[#1b1c20] p-4 rounded-xl border border-[#2c2d33]">
                <label class="block text-[10px] font-bold text-gray-400 mb-2">VS 매치업 오버레이 링크</label>
                <div class="flex gap-2">
                    <input type="text" id="vs-url-input" readonly class="w-full bg-[#0b0c0e] border border-[#2c2d33] rounded px-2 py-1 text-xs text-gray-300">
                    <button id="btn-copy-vs-url" class="bg-[#2c2d33] hover:bg-[#3c3d44] text-white px-3 py-1 rounded text-xs font-bold whitespace-nowrap cursor-pointer">복사</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <!-- 좌측: 대진표 설정 패널 -->
            <div class="bg-[#1b1c20] p-4 rounded-xl border border-[#2c2d33]">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-[#00FFA3]">전체 대진표 설정 (1~7세트)</h3>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-gray-400">송출 세트:</span>
                        <select id="active-set" class="bg-[#0b0c0e] border border-[#2c2d33] rounded px-2 py-1 text-xs text-white font-bold">
                            <option value="1">1세트</option><option value="2">2세트</option><option value="3">3세트</option>
                            <option value="4">4세트</option><option value="5">5세트</option><option value="6">6세트</option><option value="7">7세트</option>
                        </select>
                    </div>
                </div>
                <div class="max-h-56 overflow-y-auto mb-3">
                    <table class="w-full text-xs">
                        <thead>
                            <tr class="text-gray-400 border-b border-[#2c2d33]">
                                <th class="p-1">세트</th>
                                <th class="p-1">팀1 선수</th>
                                <th class="p-1">맵</th>
                                <th class="p-1">팀2 선수</th>
                            </tr>
                        </thead>
                        <tbody id="match-table-body"></tbody>
                    </table>
                </div>
                <button id="btn-save-match" class="w-full bg-[#00FFA3] hover:bg-[#00e692] text-black font-extrabold py-2 rounded-lg text-sm cursor-pointer">
                    대진표 화면 송출 (적용하기)
                </button>
            </div>

            <!-- 우측: 스코어 제어 패널 -->
            <div class="bg-[#1b1c20] p-4 rounded-xl border border-[#2c2d33] flex flex-col justify-between">
                <h3 class="text-sm font-bold text-[#00FFA3] mb-3">스코어보드 세트스코어 제어</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="text-center bg-[#141518] p-3 rounded-xl border border-[#2c2d33]">
                        <h4 class="text-xs font-bold text-blue-400 mb-1">팀 1 스코어</h4>
                        <div class="text-4xl font-black mb-3 text-[#00FFA3]" id="p1Score">0</div>
                        <div class="flex justify-center gap-2">
                            <button id="btn-p1-plus" class="bg-[#00FFA3] text-black px-3 py-1 rounded font-bold cursor-pointer">+</button>
                            <button id="btn-p1-minus" class="bg-[#2c2d33] text-white px-3 py-1 rounded font-bold cursor-pointer">-</button>
                        </div>
                    </div>
                    <div class="text-center bg-[#141518] p-3 rounded-xl border border-[#2c2d33]">
                        <h4 class="text-xs font-bold text-red-400 mb-1">팀 2 스코어</h4>
                        <div class="text-4xl font-black mb-3 text-[#00FFA3]" id="p2Score">0</div>
                        <div class="flex justify-center gap-2">
                            <button id="btn-p2-plus" class="bg-[#00FFA3] text-black px-3 py-1 rounded font-bold cursor-pointer">+</button>
                            <button id="btn-p2-minus" class="bg-[#2c2d33] text-white px-3 py-1 rounded font-bold cursor-pointer">-</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ⚔️ VS 매치업 제어 패널 -->
        <div class="bg-[#1b1c20] p-4 rounded-xl border border-[#2c2d33]">
            <h3 class="text-sm font-bold text-[#00FFA3] mb-3 flex items-center justify-between">
                <span>VS 매치업 화면 제어 (선수 소개 화면)</span>
                <span class="text-[10px] bg-gray-800 px-2 py-0.5 rounded text-gray-300">Independent Overlay</span>
            </h3>
            <div class="grid grid-cols-3 gap-3 mb-3">
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">팀 1 출전 선수</label>
                    <select id="vs-t1-player" class="w-full bg-[#0b0c0e] border border-[#2c2d33] rounded p-1.5 text-xs text-white"></select>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">경기 맵</label>
                    <select id="vs-map" class="w-full bg-[#0b0c0e] border border-[#2c2d33] rounded p-1.5 text-xs text-white"></select>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">팀 2 출전 선수</label>
                    <select id="vs-t2-player" class="w-full bg-[#0b0c0e] border border-[#2c2d33] rounded p-1.5 text-xs text-white"></select>
                </div>
            </div>
            <button id="btn-save-vs" class="w-full bg-[#00FFA3] hover:bg-[#00e692] text-black py-2 rounded text-xs font-extrabold cursor-pointer">
                VS 매치업 화면 송출하기
            </button>
        </div>
    </div>
</body>
</html>
