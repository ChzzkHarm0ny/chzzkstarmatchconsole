<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CHZZK Multi-Set ProLeague Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: rgba(0, 0, 0, 0); margin: 0; overflow-y: auto; }
        .race-P { color: #FFE000; }
        .race-T { color: #00AFFF; }
        .race-Z { color: #FF4545; }
        .player-loser { color: #4b5563 !important; opacity: 0.5; }
        #list-wrapper { transition: opacity 0.3s ease; }
        .overlay-active-match {
            border: 2px solid #00FFA3 !important;
            background-color: rgba(0, 255, 163, 0.15) !important;
            box-shadow: 0 0 15px rgba(0, 255, 163, 0.5);
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let playerRaceMap = {};

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');

            if (!roomId) return;

            const roomRef = ref(db, "rooms/" + roomId);
            onValue(roomRef, async (snapshot) => {
                const data = snapshot.val() || {};
                let listEl = document.getElementById('list-wrapper');
                if (data.matchState && data.matchState.listVisible === false) {
                    listEl.style.opacity = '0';
                    listEl.style.pointerEvents = 'none';
                    return;
                } else {
                    listEl.style.opacity = '1';
                    listEl.style.pointerEvents = 'auto';
                }

                if (data.settings && data.settings.gasUrl) {
                    try {
                        let res = await fetch(data.settings.gasUrl + "?action=getData");
                        let sheetData = await res.json();
                        if (sheetData.players) {
                            sheetData.players.forEach(p => { playerRaceMap[p.name] = p.race; });
                        }
                    } catch (e) {}
                }

                if (data.matchState) {
                    let ms = data.matchState;
                    let isSoloMode = (ms.matchMode === 'solo');
                    let team1Name = isSoloMode ? "P1" : (ms.teamNames ? ms.teamNames.team1 : "1팀");
                    let team2Name = isSoloMode ? "P2" : (ms.teamNames ? ms.teamNames.team2 : "2팀");
                    let team1Color = (ms.teamNames && ms.teamNames.team1Color) ? ms.teamNames.team1Color : "#1d3557";
                    let team2Color = (ms.teamNames && ms.teamNames.team2Color) ? ms.teamNames.team2Color : "#6a1b1b";

                    if (ms.matchSetsObj) {
                        let wrapper = document.getElementById('sets-wrapper');
                        wrapper.innerHTML = '';

                        Object.values(ms.matchSetsObj).forEach(setObj => {
                            let card = document.createElement('div');
                            card.className = "flex flex-col bg-[#141518]/95 text-white border border-[#2c2d33] rounded-2xl shadow-2xl backdrop-blur-md w-[420px] shrink-0";
                            
                            let headerHtml = `
                                <div class="bg-[#1b1c20] border-b border-[#2c2d33] py-3 text-center">
                                    <div class="text-xs tracking-widest text-[#00FFA3] font-black mb-2">${setObj.name.toUpperCase()}</div>
                                    <div class="grid grid-cols-5 text-base font-black items-center px-4">
                                        <div class="col-span-2 py-2 px-3 rounded-lg truncate text-white shadow text-base" style="background-color: ${team1Color};">${team1Name}</div>
                                        <div class="col-span-1 flex items-center justify-center text-gray-400 text-base">-</div>
                                        <div class="col-span-2 py-2 px-3 rounded-lg truncate text-white shadow text-base" style="background-color: ${team2Color};">${team2Name}</div>
                                    </div>
                                </div>
                            `;

                            let bodyHtml = `<div class="p-3 flex flex-col gap-2">`;
                            let activeMatchIdx = setObj.activeMatchIdx || 1;
                            
                            for (let i = 1; i <= setObj.matchesCount; i++) {
                                let match = (setObj.matches && setObj.matches[i]) ? setObj.matches[i] : {};
                                let t1Players = match.t1Players || [match.t1Player || "미정"];
                                let t2Players = match.t2Players || [match.t2Player || "미정"];
                                let mapName = match.mapName || "미정";
                                let winner = match.winner || "";

                                // [핵심 수정] "-" 일 경우 자리만 차지하고 투명하게 보이도록 처리
                                let t1Html = t1Players.map(p => {
                                    if(p === "-") return `<div class="truncate text-transparent select-none">-</div>`;
                                    return `<div class="truncate text-xl font-bold ${getRaceClass(p)} ${winner === 't2' ? 'player-loser' : ''}">${p}</div>`;
                                }).join('');

                                let t2Html = t2Players.map(p => {
                                    if(p === "-") return `<div class="truncate text-transparent select-none">-</div>`;
                                    return `<div class="truncate text-xl font-bold ${getRaceClass(p)} ${winner === 't1' ? 'player-loser' : ''}">${p}</div>`;
                                }).join('');

                                let isCurrentActive = (Number(activeMatchIdx) === i);
                                let rowHighlightClass = isCurrentActive ? "overlay-active-match" : "border-[#2c2d33] bg-[#1b1c20]/90";

                                bodyHtml += `
                                    <div class="flex items-center justify-between px-4 py-2.5 rounded-xl border text-base font-bold shadow-inner ${rowHighlightClass}">
                                        <div class="w-8 text-center text-gray-400 font-black text-sm">${i}</div>
                                        <div class="w-32 text-center flex flex-col gap-1 text-base leading-tight">${t1Html}</div>
                                        <div class="w-32 text-center text-gray-300 font-medium truncate text-sm px-1">${mapName}</div>
                                        <div class="w-32 text-center flex flex-col gap-1 text-base leading-tight">${t2Html}</div>
                                    </div>
                                `;
                            }
                            bodyHtml += `</div>`;

                            card.innerHTML = headerHtml + bodyHtml;
                            wrapper.appendChild(card);
                        });
                    }
                }
            });
        };

        function getRaceClass(playerName) {
            let race = playerRaceMap[playerName];
            if (race === "프로토스") return "race-P";
            if (race === "테란") return "race-T";
            if (race === "저그") return "race-Z";
            return "text-white";
        }
    </script>
</head>
<body class="flex items-start justify-start p-4 font-sans">
    <div id="list-wrapper">
        <div id="sets-wrapper" class="flex items-start gap-4 overflow-x-auto"></div>
    </div>
</body>
</html>
