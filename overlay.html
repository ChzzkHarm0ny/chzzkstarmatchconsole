<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CHZZK Multi-Set ProLeague Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: rgba(0, 0, 0, 0); margin: 0; overflow-y: auto; }
        .race-P { color: #FFE000; }
        .race-T { color: #00AFFF; }
        .race-Z { color: #FF4545; }
        .player-loser { color: #4b5563 !important; opacity: 0.5; }
        #list-wrapper { transition: opacity 0.3s ease; }
        .overlay-active-match {
            border: 1px solid #00FFA3 !important;
            background-color: rgba(0, 255, 163, 0.12) !important;
            box-shadow: 0 0 12px rgba(0, 255, 163, 0.45);
        }
        .set-card { font-variant-numeric: tabular-nums; }
        .set-row:nth-child(even) { background-color: rgba(255,255,255,0.03); }
        .set-row:nth-child(odd) { background-color: transparent; }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let playerRaceMap = {};

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');

            if (!roomId) return;

            const roomRef = ref(db, "rooms/" + roomId);
            onValue(roomRef, async (snapshot) => {
                const data = snapshot.val() || {};
                let listEl = document.getElementById('list-wrapper');
                if (data.matchState && data.matchState.listVisible === false) {
                    listEl.style.opacity = '0';
                    listEl.style.pointerEvents = 'none';
                    return;
                } else {
                    listEl.style.opacity = '1';
                    listEl.style.pointerEvents = 'auto';
                }

                if (data.settings && data.settings.gasUrl) {
                    try {
                        let res = await fetch(data.settings.gasUrl + "?action=getData");
                        let sheetData = await res.json();
                        if (sheetData.players) {
                            sheetData.players.forEach(p => { playerRaceMap[p.name] = p.race; });
                        }
                    } catch (e) {}
                }

                if (data.matchState) {
                    let ms = data.matchState;
                    let isSoloMode = (ms.matchMode === 'solo');
                    let team1Name = isSoloMode ? "P1" : (ms.teamNames ? ms.teamNames.team1 : "1팀");
                    let team2Name = isSoloMode ? "P2" : (ms.teamNames ? ms.teamNames.team2 : "2팀");
                    // 개인전(solo)일 때는 콘솔의 "개인별 색상 설정"(player1Color/player2Color, VS·스코어보드와 동일한 색)을 쓰고,
                    // 팀전일 때는 팀 색상(teamNames.team1Color/team2Color)을 씁니다.
                    let team1Color = isSoloMode
                        ? ((ms.playerColors && ms.playerColors.player1Color) || "#0C48CC")
                        : ((ms.teamNames && ms.teamNames.team1Color) ? ms.teamNames.team1Color : "#1d3557");
                    let team2Color = isSoloMode
                        ? ((ms.playerColors && ms.playerColors.player2Color) || "#F40404")
                        : ((ms.teamNames && ms.teamNames.team2Color) ? ms.teamNames.team2Color : "#6a1b1b");

                    if (ms.matchSetsObj) {
                        let wrapper = document.getElementById('sets-wrapper');
                        wrapper.innerHTML = '';

                        Object.values(ms.matchSetsObj).forEach(setObj => {
                            let card = document.createElement('div');
                            card.className = "set-card flex flex-col bg-[#141518]/95 text-white border border-[#2c2d33] rounded-xl shadow-2xl backdrop-blur-md w-[280px] shrink-0 overflow-hidden";

                            // 세트 내 매치들의 승패를 세어 팀 스코어 계산
                            let t1Wins = 0, t2Wins = 0;
                            if (setObj.matches) {
                                Object.values(setObj.matches).forEach(m => {
                                    if (m.winner === 't1') t1Wins++;
                                    else if (m.winner === 't2') t2Wins++;
                                });
                            }

                            let headerHtml = `
                                <div class="bg-[#1b1c20] border-b border-[#2c2d33] py-1.5 text-center">
                                    <div class="text-xs tracking-widest text-gray-300 font-bold">${setObj.name}</div>
                                </div>
                                <div class="border-b border-[#2c2d33] py-2 flex items-center justify-center gap-2">
                                    <span class="text-2xl font-black" style="color:${team1Color};">${t1Wins}</span>
                                    <span class="text-lg font-black text-gray-500">:</span>
                                    <span class="text-2xl font-black" style="color:${team2Color};">${t2Wins}</span>
                                </div>
                            `;

                            let bodyHtml = `<div class="flex flex-col">`;
                            let activeMatchIdx = setObj.activeMatchIdx || 1;

                            for (let i = 1; i <= setObj.matchesCount; i++) {
                                let match = (setObj.matches && setObj.matches[i]) ? setObj.matches[i] : {};
                                let t1Players = match.t1Players || [match.t1Player || "미정"];
                                let t2Players = match.t2Players || [match.t2Player || "미정"];
                                let mapNameFull = match.mapName || "미정";
                                let mapName = mapNameFull.slice(0, 2);
                                let winner = match.winner || "";

                                // [핵심 수정] "-" 일 경우 자리만 차지하고 투명하게 보이도록 처리
                                // 선수명은 오버레이 디자인상 4글자까지만 표시(등록은 4글자 이내 권장)
                                let t1Html = t1Players.map(p => {
                                    if(p === "-") return `<div class="truncate text-transparent select-none">-</div>`;
                                    let dispName = p.length > 4 ? p.slice(0, 4) : p;
                                    return `<div class="truncate text-base font-black ${getRaceClass(p)} ${winner === 't2' ? 'player-loser' : ''}">${dispName}</div>`;
                                }).join('');

                                let t2Html = t2Players.map(p => {
                                    if(p === "-") return `<div class="truncate text-transparent select-none">-</div>`;
                                    let dispName = p.length > 4 ? p.slice(0, 4) : p;
                                    return `<div class="truncate text-base font-black ${getRaceClass(p)} ${winner === 't1' ? 'player-loser' : ''}">${dispName}</div>`;
                                }).join('');

                                let isCurrentActive = (Number(activeMatchIdx) === i);
                                let rowHighlightClass = isCurrentActive ? "overlay-active-match" : "";

                                bodyHtml += `
                                    <div class="set-row flex items-center justify-between px-1.5 py-1.5 border-b border-[#232428] text-sm font-bold ${rowHighlightClass}">
                                        <div class="w-4 text-center text-gray-500 font-black text-xs">${i}</div>
                                        <div class="flex-1 text-center flex flex-col leading-tight">${t1Html}</div>
                                        <div class="w-11 text-center text-gray-400 font-medium truncate text-[10px] px-0.5" title="${mapNameFull}">${mapName}</div>
                                        <div class="flex-1 text-center flex flex-col leading-tight">${t2Html}</div>
                                    </div>
                                `;
                            }
                            bodyHtml += `</div>`;

                            card.innerHTML = headerHtml + bodyHtml;
                            wrapper.appendChild(card);
                        });
                    }
                }
            });
        };

        function getRaceClass(playerName) {
            let race = playerRaceMap[playerName];
            if (race === "프로토스") return "race-P";
            if (race === "테란") return "race-T";
            if (race === "저그") return "race-Z";
            return "text-white";
        }
    </script>
</head>
<body class="flex items-start justify-start p-4 font-sans">
    <div id="list-wrapper">
        <div id="sets-wrapper" class="flex items-start gap-4 overflow-x-auto"></div>
    </div>
</body>
</html>
