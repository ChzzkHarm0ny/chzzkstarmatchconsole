<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCraft Match List - Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: transparent !important;
            margin: 0;
            padding: 10px;
            font-family: 'Malgun Gothic', 'Arial', sans-serif;
        }

        .match-list-container {
            background-color: rgba(10, 10, 12, 0.9);
            border: 2px solid #2c2d33;
            border-radius: 4px;
            padding: 8px;
            width: 380px;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .match-header {
            background: linear-gradient(to bottom, #d1d5db, #9ca3af);
            color: #111;
            border-radius: 3px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
        }
        .league-title {
            font-size: 13px;
            text-transform: uppercase;
        }
        .total-score {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .match-item {
            display: grid;
            grid-template-columns: 24px 1fr 50px 1fr; /* 맵 칸을 앞두글자에 맞춰 살짝 줄임 (70px -> 50px) */
            align-items: center;
            background-color: #0b0c0e;
            border: 1px solid #2c2d33;
            border-radius: 3px;
            padding: 4px 6px;
            font-size: 13px;
        }

        .match-number {
            color: #9ca3af;
            font-weight: bold;
            text-align: center;
            font-size: 12px;
        }

        .player-name {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-1 { text-align: right; padding-right: 6px; }
        .player-2 { text-align: left; padding-left: 6px; }

        .map-name {
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            background-color: #141518;
            border: 1px solid #2c2d33;
            border-radius: 2px;
            padding: 2px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .race-P { color: #FFE000; }
        .race-T { color: #00AFFF; }
        .race-Z { color: #FF4545; }
        .race-E { color: #FFFFFF; }

        .match-item.active {
            background-color: #1b1c20;
            border: 1px solid #00FFA3;
            box-shadow: 0 0 6px rgba(0,255,163,0.3);
        }
        .match-item.active .match-number {
            color: #00FFA3;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="match-list-wrapper" class="match-list-container hidden">
        
        <div class="match-header">
            <div id="league-title-text" class="league-title">1set 프로리그</div>
            <div id="total-score-text" class="total-score">2 : 4</div>
        </div>

        <div id="matches-container" class="flex flex-col gap-1.5">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        if (roomId) {
            const roomRef = ref(db, "rooms/" + roomId);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const isVisible = data.matchState?.listVisible !== false;
                const wrapper = document.getElementById('match-list-wrapper');
                if (isVisible) {
                    wrapper.classList.remove('hidden');
                } else {
                    wrapper.classList.add('hidden');
                }

                const leagueTitle = data.matchState?.leagueTitle || "프로리그";
                document.getElementById('league-title-text').innerText = leagueTitle;

                const matchSets = data.matchState?.matchSetsObj || {};
                const matchesContainer = document.getElementById('matches-container');
                matchesContainer.innerHTML = '';

                let totalWinsT1 = 0;
                let totalWinsT2 = 0;
                let matchCounter = 1;

                Object.values(matchSets).forEach(setObj => {
                    const matches = setObj.matches || {};
                    const activeMatchIdx = setObj.activeMatchIdx;

                    for (let i = 1; i <= setObj.matchesCount; i++) {
                        const m = matches[i];
                        if (!m) continue;

                        let p1Name = "미정";
                        let p2Name = "미정";
                        let p1Race = "E";
                        let p2Race = "E";
                        
                        // 맵 이름 앞 두 글자만 추출 (예: "투혼" -> "투혼", "폴리포이드" -> "폴리")
                        let rawMapName = m.mapName || "";
                        let mapName = rawMapName.substring(0, 2);

                        if (m.t1Players && Array.isArray(m.t1Players)) {
                             let activeP1 = m.t1Players.filter(p => p !== "-" && p !== "미정");
                             if(activeP1.length > 0) {
                                 p1Name = activeP1.join(', ');
                                 if(data.playerRaceMap && data.playerRaceMap[activeP1[0]]) {
                                     p1Race = data.playerRaceMap[activeP1[0]].charAt(0);
                                 }
                             } else if (m.t1Players.length > 0 && m.t1Players[0] === "-") {
                                 p1Name = "-";
                             }
                        }

                        if (m.t2Players && Array.isArray(m.t2Players)) {
                            let activeP2 = m.t2Players.filter(p => p !== "-" && p !== "미정");
                            if(activeP2.length > 0) {
                                p2Name = activeP2.join(', ');
                                if(data.playerRaceMap && data.playerRaceMap[activeP2[0]]) {
                                    p2Race = data.playerRaceMap[activeP2[0]].charAt(0);
                                 }
                            } else if (m.t2Players.length > 0 && m.t2Players[0] === "-") {
                                p2Name = "-";
                            }
                        }

                        let winClass1 = "";
                        let winClass2 = "";
                        if (m.winner === 't1') {
                            totalWinsT1++;
                            winClass1 = " opacity-100 font-black ";
                            winClass2 = " opacity-40 ";
                        } else if (m.winner === 't2') {
                            totalWinsT2++;
                            winClass2 = " opacity-100 font-black ";
                            winClass1 = " opacity-40 ";
                        }

                        const isActive = (setObj.id === data.matchState?.activeSetId && activeMatchIdx === i);

                        const matchDiv = document.createElement('div');
                        matchDiv.className = `match-item ${isActive ? 'active' : ''}`;
                        matchDiv.innerHTML = `
                            <div class="match-number">${matchCounter}</div>
                            <div class="player-name player-1 race-${p1Race} ${winClass1}">${p1Name}</div>
                            <div class="map-name" title="${rawMapName}">${mapName}</div>
                            <div class="player-name player-2 race-${p2Race} ${winClass2}">${p2Name}</div>
                        `;
                        matchesContainer.appendChild(matchDiv);
                        matchCounter++;
                    }
                });

                document.getElementById('total-score-text').innerText = `${totalWinsT1} : ${totalWinsT2}`;

            });
        }
    </script>
</body>
</html>
