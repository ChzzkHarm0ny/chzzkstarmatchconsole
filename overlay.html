<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CHZZK Match List Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: rgba(0, 0, 0, 0); margin: 0; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }
        
        /* 💡 박스 폭을 380px로 넉넉하게 늘려 글자가 잘리지 않도록 개선 */
        .match-list-container {
            width: 380px;
            background: rgba(18, 19, 22, 0.95);
            border: 1px solid #2c2d33;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }
        .active-match-highlight {
            background-color: rgba(0, 255, 163, 0.15) !important;
            border: 2px solid #00FFA3 !important;
        }

        /* 💡 스타크래프트 종족별 고유 색상 정의 */
        .race-color-protoss { color: #FFE000 !important; } /* 프로토스 노랑 */
        .race-color-terran { color: #00AFFF !important; }  /* 테란 하늘색 */
        .race-color-zerg { color: #FF4545 !important; }    /* 저그 빨강 */
    </style>
</head>
<body class="flex items-start justify-start p-0">
    <div id="matchlist-wrapper" class="match-list-container text-white">
        <!-- 상단 헤더 -->
        <div id="matchlist-header" class="bg-[#1b1c20] px-4 py-2.5 border-b border-[#2c2d33] flex items-center justify-between">
            <span id="league-title-text" class="text-xs font-black text-[#00FFA3] tracking-wide">스타크래프트 프로리그</span>
            <div class="flex gap-1">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-500 inline-block"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-[#00FFA3] inline-block"></span>
            </div>
        </div>

        <!-- 세트 탭 목록 -->
        <div id="matchset-tabs-bar" class="flex bg-[#0b0c0e] border-b border-[#2c2d33] overflow-x-auto"></div>

        <!-- 매치 목록 바디 -->
        <div id="matchlist-body" class="p-3 flex flex-col gap-2 max-h-[420px] overflow-y-auto"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        let playerRaceMap = {}; // 선수별 종족 저장 맵

        if (roomId) {
            const roomRef = ref(db, "rooms/" + roomId);
            onValue(roomRef, async (snapshot) => {
                const data = snapshot.val() || {};
                let ms = data.matchState || {};

                // 구글 시트에서 선수 목록(종족 정보 포함)을 가져와 매핑 구축
                if (data.settings && data.settings.gasUrl) {
                    try {
                        let res = await fetch(data.settings.gasUrl + "?action=getData");
                        let sheetData = await res.json();
                        if (sheetData.players) {
                            sheetData.players.forEach(p => {
                                playerRaceMap[p.name] = p.race; // 예: "시폰케이크" -> "프로토스"
                            });
                        }
                    } catch (e) {
                        console.error("종족 매핑 데이터 로드 실패", e);
                    }
                }

                let wrapper = document.getElementById('matchlist-wrapper');
                if (wrapper) {
                    if (ms.listVisible === false) {
                        wrapper.style.opacity = '0';
                        return;
                    } else {
                        wrapper.style.opacity = '1';
                    }
                }

                if (ms.leagueTitle) {
                    document.getElementById('league-title-text').innerText = ms.leagueTitle;
                }

                let matchSetsObj = ms.matchSetsObj || ms.matchSetsConfig || {
                    1: { id: 1, name: "1세트 (매치)", matchesCount: 7, matches: {} }
                };

                let setKeys = Object.keys(matchSetsObj).sort((a,b)=>a-b);
                let activeSetId = Number(sessionStorage.getItem('active_set_id') || setKeys[0] || 1);
                if(!matchSetsObj[activeSetId]) activeSetId = Number(setKeys[0] || 1);

                let tabsBar = document.getElementById('matchset-tabs-bar');
                tabsBar.innerHTML = '';
                if (setKeys.length > 1) {
                    tabsBar.style.display = 'flex';
                    setKeys.forEach(setId => {
                        let sObj = matchSetsObj[setId];
                        let tabBtn = document.createElement('button');
                        tabBtn.className = `flex-1 py-1.5 px-2 text-[11px] font-black cursor-pointer whitespace-nowrap transition-all border-b-2 ${Number(setId) === Number(activeSetId) ? 'bg-[#1b1c20] text-[#00FFA3] border-[#00FFA3]' : 'bg-transparent text-gray-400 border-transparent hover:text-white'}`;
                        tabBtn.innerText = sObj.name;
                        tabBtn.onclick = () => {
                            sessionStorage.setItem('active_set_id', setId);
                            renderActiveSetMatches(matchSetsObj[setId]);
                        };
                        tabsBar.appendChild(tabBtn);
                    });
                } else {
                    tabsBar.style.display = 'none';
                }

                renderActiveSetMatches(matchSetsObj[activeSetId]);
            });
        }

        // 종족에 따른 CSS 클래스 반환 함수
        function getRaceColorClass(playerName) {
            let race = playerRaceMap[playerName];
            if (race === '프로토스') return 'race-color-protoss';
            if (race === '테란') return 'race-color-terran';
            if (race === '저그') return 'race-color-zerg';
            return 'text-white'; // 정보가 없으면 기본 흰색
        }

        function renderActiveSetMatches(setObj) {
            if(!setObj) return;
            let body = document.getElementById('matchlist-body');
            body.innerHTML = '';

            let matches = setObj.matches || {};
            let activeMatchIdx = Number(setObj.activeMatchIdx || 1);
            let count = setObj.matchesCount || 7;

            for (let i = 1; i <= count; i++) {
                let m = matches[i] || {};
                let t1Players = m.t1Players || [m.t1Player || "미정"];
                let t2Players = m.t2Players || [m.t2Player || "미정"];
                
                let t1Str = t1Players.filter(x => x !== "-" && x !== "미정").join(', ') || "미정";
                let t2Str = t2Players.filter(x => x !== "-" && x !== "미정").join(', ') || "미정";
                let mapName = m.mapName || "맵 미정";
                let winner = m.winner || "";

                let isCurrent = (i === activeMatchIdx);

                let row = document.createElement('div');
                row.className = `flex items-center justify-between px-3 py-2 rounded-lg border transition-all ${isCurrent ? 'active-match-highlight bg-[#14261e]' : 'bg-[#141518] border-[#2c2d33]'}`;

                // 첫 번째 선수 이름 기준으로 종족 색상 적용
                let primaryT1 = t1Players.find(x => x !== "-" && x !== "미정") || "";
                let primaryT2 = t2Players.find(x => x !== "-" && x !== "미정") || "";

                let t1ColorClass = winner === 't1' ? 'text-[#00FFA3] font-black' : (isCurrent ? 'font-black ' + getRaceColorClass(primaryT1) : 'font-bold ' + getRaceColorClass(primaryT1));
                let t2ColorClass = winner === 't2' ? 'text-[#00FFA3] font-black' : (isCurrent ? 'font-black ' + getRaceColorClass(primaryT2) : 'font-bold ' + getRaceColorClass(primaryT2));

                row.innerHTML = `
                    <div class="flex items-center gap-2.5 w-[38%] overflow-hidden">
                        <span class="text-[11px] font-black px-1.5 py-0.5 rounded shrink-0 ${isCurrent ? 'bg-[#00FFA3] text-black' : 'bg-[#2c2d33] text-gray-400'}">${i}</span>
                        <span class="text-[13.5px] truncate tracking-tight ${t1ColorClass}" title="${t1Str}">${t1Str}</span>
                    </div>
                    <div class="text-[12px] font-extrabold text-[#94a3b8] truncate text-center w-[28%] px-1">
                        ${mapName}
                    </div>
                    <div class="flex items-center justify-end gap-2 w-[34%] overflow-hidden text-right">
                        <span class="text-[13.5px] truncate tracking-tight ${t2ColorClass}" title="${t2Str}">${t2Str}</span>
                        ${winner ? `<span class="text-[10px] text-[#00FFA3] font-black shrink-0">승</span>` : ''}
                    </div>
                `;
                body.appendChild(row);
            }
        }
    </script>
</body>
</html>
