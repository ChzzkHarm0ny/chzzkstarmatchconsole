<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CHZZK VS Matchup Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: rgba(0, 0, 0, 0); margin: 0; overflow: hidden; }
        .race-P { background-color: #FFE000; color: #000; }
        .race-T { background-color: #00AFFF; color: #000; }
        .race-Z { background-color: #FF4545; color: #fff; }
        
        #vs-wrapper { opacity: 0; transition: opacity 0.8s ease-in-out; }
        #vs-wrapper.active { opacity: 1; }
        
        /* 맵 이미지 핵심: 높이 고정, 가로 비율 유동 */
        .map-img-fixed {
            height: 70px !important;
            width: auto !important;
            max-width: 100% !important;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }
        
        .text-shadow-custom { text-shadow: 1px 1px 3px rgba(0,0,0,0.7); }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let fadeTimer = null;
        let lastProcessedTimestamp = 0;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');
            if (!roomId) return;

            const roomRef = ref(db, `rooms/${roomId}`);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val() || {};
                let ms = data.matchState || {};

                let wrapperEl = document.getElementById('vs-wrapper-outer');
                if (ms.vsVisible === false) {
                    wrapperEl.style.opacity = '0';
                    wrapperEl.style.pointerEvents = 'none';
                    return;
                } else {
                    wrapperEl.style.opacity = '1';
                    wrapperEl.style.pointerEvents = 'auto';
                }

                let vs = ms.vsMatch;
                let teamNames = ms.teamNames || { team1: "1팀", team2: "2팀", team1Color: "#1d3557", team2Color: "#6a1b1b" };
                let isSoloMode = ms.matchMode === "solo";

                if (vs && vs.timestamp && vs.timestamp !== lastProcessedTimestamp) {
                    lastProcessedTimestamp = vs.timestamp;

                    let t1Arr = Array.isArray(vs.t1) ? vs.t1 : [vs.t1];
                    let t2Arr = Array.isArray(vs.t2) ? vs.t2 : [vs.t2];
                    
                    document.getElementById('t1-container').innerHTML = renderTeamLayout(t1Arr, teamNames.team1, teamNames.team1Color, false, isSoloMode);
                    document.getElementById('t2-container').innerHTML = renderTeamLayout(t2Arr, teamNames.team2, teamNames.team2Color, true, isSoloMode);

                    if(vs.map) {
                        document.getElementById('map-name').innerText = vs.map.name || "맵 이름";
                        if(vs.map.url) document.getElementById('map-img').src = vs.map.url;
                    }

                    let matchLabel = vs.matchTitle || vs.roundTitle || (vs.matchIndex ? `${vs.matchIndex}경기` : "");
                    let matchLabelEl = document.getElementById('match-label');
                    if (matchLabelEl) {
                        if (matchLabel) {
                            matchLabelEl.innerText = matchLabel;
                            matchLabelEl.style.display = 'block';
                        } else {
                            matchLabelEl.style.display = 'none';
                        }
                    }

                    triggerFadeAnimation();
                }
            });
        };

        function renderTeamLayout(playersArr, teamName, teamColor, isRightSide, isSoloMode) {
            let hasTeamName = teamName && teamName.trim() !== "";
            let teamLabelHtml = (isSoloMode || !hasTeamName)
                ? ""
                : `<span class="px-3 py-1.5 rounded-lg text-xs font-black text-white shadow-md w-full text-center border border-white/10 tracking-wide" style="background-color:${teamColor}">${teamName}</span>`;

            let html = `
            <div class="flex flex-col w-[385px] gap-3 items-center bg-[#0e0f13]/95 border border-[#32343d] rounded-2xl p-4 shadow-2xl backdrop-blur-md">
                ${teamLabelHtml}`;

            if (playersArr.length === 2) {
                html += `<div class="flex gap-2.5 w-full h-[180px]">`;
                playersArr.forEach(p => {
                    let raceClass = p.race === '프로토스' ? 'race-P' : (p.race === '테란' ? 'race-T' : 'race-Z');
                    html += `
                    <div class="flex-1 bg-[#17181c] border border-[#2c2d36] rounded-xl overflow-hidden flex flex-col items-center justify-between p-2.5 shadow-inner">
                        <img src="${p.img}" class="w-full h-[105px] object-cover rounded-lg border border-[#2c2d36] bg-black/50 shadow" onerror="this.src='https://placehold.co/120x160/1b1c20/FFF?text=User'">
                        <div class="flex flex-col items-center text-center w-full truncate mt-1">
                            <span class="text-sm font-black text-white truncate w-full tracking-tight">${p.name}</span>
                            <span class="px-2.5 py-0.5 mt-0.5 rounded text-[10px] font-black text-black shadow-sm ${raceClass}">${p.race}</span>
                        </div>
                    </div>`;
                });
                html += `</div>`;
            } 
            else if (playersArr.length > 2) {
                let leadPlayer = playersArr[0] || { name: "미정", race: "미정", img: "" };
                let subPlayers = playersArr.slice(1);
                let leadRaceClass = leadPlayer.race === '프로토스' ? 'race-P' : (leadPlayer.race === '테란' ? 'race-T' : 'race-Z');

                html += `
                <div class="relative w-full h-[140px] bg-[#17181c] border border-[#2c2d36] rounded-xl overflow-hidden flex ${isRightSide ? 'flex-row-reverse' : 'flex-row'} items-center p-3 gap-4 shadow-inner">
                    <img src="${leadPlayer.img}" class="w-24 h-full object-cover rounded-lg border border-[#2c2d36] shrink-0 bg-black/50 shadow" onerror="this.src='https://placehold.co/120x160/1b1c20/FFF?text=User'">
                    <div class="flex flex-col justify-center ${isRightSide ? 'items-end text-right' : 'items-start text-left'} flex-1 truncate">
                        <span class="text-lg font-black text-white truncate w-full tracking-tight text-shadow-custom">${leadPlayer.name}</span>
                        <span class="px-2.5 py-0.5 mt-1 rounded text-xs font-black text-black shadow-sm ${leadRaceClass}">${leadPlayer.race}</span>
                    </div>
                </div>`;

                html += `<div class="flex gap-2 w-full justify-start mt-0.5">`;
                subPlayers.forEach(p => {
                    let subRaceClass = p.race === '프로토스' ? 'race-P' : (p.race === '테란' ? 'race-T' : 'race-Z');
                    html += `
                    <div class="flex-1 flex items-center gap-2 bg-[#17181c] border border-[#2c2d36] rounded-lg p-1.5 overflow-hidden shadow-inner">
                        <img src="${p.img}" class="w-8 h-8 object-cover rounded border border-[#2c2d36] shrink-0 bg-black/50" onerror="this.src='https://placehold.co/60x60/1b1c20/FFF?text=User'">
                        <div class="flex flex-col truncate">
                            <span class="text-xs font-bold text-white truncate">${p.name}</span>
                            <span class="px-1.5 rounded text-[8px] font-black text-black ${subRaceClass} w-max mt-0.5">${p.race}</span>
                        </div>
                    </div>`;
                });
                html += `</div>`;
            } 
            else {
                let p = playersArr[0] || { name: "미정", race: "미정", img: "" };
                let raceClass = p.race === '프로토스' ? 'race-P' : (p.race === '테란' ? 'race-T' : 'race-Z');
                html += `
                <div class="relative w-full h-[180px] bg-[#17181c] border border-[#2c2d36] rounded-xl overflow-hidden flex ${isRightSide ? 'flex-row-reverse' : 'flex-row'} items-center p-3.5 gap-4 shadow-inner">
                    <img src="${p.img}" class="w-28 h-full object-cover rounded-lg border border-[#2c2d36] shrink-0 bg-black/50 shadow" onerror="this.src='https://placehold.co/120x160/1b1c20/FFF?text=User'">
                    <div class="flex flex-col justify-center ${isRightSide ? 'items-end text-right' : 'items-start text-left'} flex-1 truncate">
                        <span class="text-xl font-black text-white truncate w-full tracking-tight text-shadow-custom">${p.name}</span>
                        <span class="px-3 py-0.5 mt-1.5 rounded text-xs font-black text-black shadow-sm ${raceClass}">${p.race}</span>
                    </div>
                </div>`;
            }

            html += `</div>`;
            return html;
        }

        function triggerFadeAnimation() {
            let container = document.getElementById('vs-wrapper');
            if (!container) return;

            if (fadeTimer) clearTimeout(fadeTimer);

            container.classList.remove('active');
            void container.offsetWidth; 

            container.classList.add('active');

            fadeTimer = setTimeout(() => {
                container.classList.remove('active');
            }, 6000);
        }
    </script>
</head>
<body class="flex items-center justify-center h-screen p-6">
    <div id="vs-wrapper-outer" style="transition: opacity 0.3s ease; opacity: 0;">
        <div id="vs-wrapper" class="flex items-center justify-center gap-6 bg-[#121317]/95 border-2 border-[#32343d] rounded-2xl p-6 shadow-2xl backdrop-blur-md w-[980px]">
            
            <div id="t1-container"></div>
            
            <!-- 중앙 영역 -->
            <div class="flex flex-col items-center justify-center gap-3 shrink-0 w-[180px]">
                <!-- 경기 정보 뱃지 (텍스트 잘림 방지 및 자동 줄바꿈 적용) -->
                <span id="match-label" class="w-full px-2 py-1.5 bg-[#17181c] border border-[#32343d] rounded-lg text-[10px] font-black text-gray-200 text-center tracking-tight leading-tight break-keep" style="display: none;"></span>
                
                <span class="text-3xl font-black italic text-[#00FFA3] tracking-widest drop-shadow-[0_0_12px_rgba(0,255,163,0.6)] my-0.5">VS</span>
                
                <div class="flex flex-col items-center bg-[#17181c] border border-[#32343d] p-2.5 rounded-xl shadow-lg w-full">
                    <div class="flex items-center justify-center h-[70px] mb-2 overflow-hidden w-full">
                        <img id="map-img" src="https://placehold.co/120x80/1b1c20/FFF?text=Map" class="map-img-fixed rounded-lg border border-[#2c2d36] shadow bg-black/50">
                    </div>
                    <span id="map-name" class="text-xs font-black text-gray-200 truncate w-full text-center tracking-tight">맵 이름</span>
                </div>
            </div>

            <div id="t2-container"></div>
        </div>
    </div>
</body>
</html>
