<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CHZZK VS Matchup Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: rgba(0, 0, 0, 0); margin: 0; overflow: hidden; }
        .race-P { background-color: #FFE000; color: #000; }
        .race-T { background-color: #00AFFF; color: #000; }
        .race-Z { background-color: #FF4545; color: #fff; }
        #vs-wrapper { opacity: 0; transition: opacity 0.8s ease-in-out; }
        #vs-wrapper.active { opacity: 1; }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let fadeTimer = null;
        let lastProcessedTimestamp = 0;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');
            if (!roomId) return;

            const roomRef = ref(db, `rooms/${roomId}`);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val() || {};
                let ms = data.matchState || {};

                let wrapperEl = document.getElementById('vs-wrapper-outer');
                if (ms.vsVisible === false) {
                    wrapperEl.style.opacity = '0';
                    return;
                } else {
                    wrapperEl.style.opacity = '1';
                }

                let vs = ms.vsMatch;
                let teamNames = ms.teamNames || { team1: "1팀", team2: "2팀", team1Color: "#1d3557", team2Color: "#6a1b1b" };

                if (vs && vs.timestamp && vs.timestamp !== lastProcessedTimestamp) {
                    lastProcessedTimestamp = vs.timestamp;

                    let t1Arr = Array.isArray(vs.t1) ? vs.t1 : [vs.t1];
                    let t2Arr = Array.isArray(vs.t2) ? vs.t2 : [vs.t2];
                    
                    document.getElementById('t1-container').innerHTML = renderTeamLayout(t1Arr, teamNames.team1, teamNames.team1Color, false);
                    document.getElementById('t2-container').innerHTML = renderTeamLayout(t2Arr, teamNames.team2, teamNames.team2Color, true);

                    if(vs.map) {
                        document.getElementById('map-name').innerText = vs.map.name || "맵 이름";
                        if(vs.map.url) document.getElementById('map-img').src = vs.map.url;
                    }

                    triggerFadeAnimation();
                }
            });
        };

        function renderTeamLayout(playersArr, teamName, teamColor, isRightSide) {
            let html = `
            <div class="flex flex-col w-[385px] gap-3 items-center bg-[#0b0c0e] border border-[#2c2d33] rounded-2xl p-4 shadow-xl">
                <span class="px-3 py-1 rounded-lg text-xs font-black text-white shadow w-full text-center" style="background-color:${teamColor}">${teamName}</span>`;

            // 💡 [조건 분기] 선수가 딱 2명일 경우 (2v2 팀플) -> 상단 대형 카드 크기를 절반씩 나누어 나란히 배치
            if (playersArr.length === 2) {
                html += `<div class="flex gap-2 w-full h-[180px]">`;
                playersArr.forEach(p => {
                    let raceClass = p.race === '프로토스' ? 'race-P' : (p.race === '테란' ? 'race-T' : 'race-Z');
                    html += `
                    <div class="flex-1 bg-[#141518] border border-[#2c2d33] rounded-xl overflow-hidden flex flex-col items-center justify-between p-2.5">
                        <img src="${p.img}" class="w-full h-[105px] object-cover rounded-lg border border-[#2c2d33] bg-black/40" onerror="this.src='https://placehold.co/120x160/1b1c20/FFF?text=User'">
                        <div class="flex flex-col items-center text-center w-full truncate mt-1">
                            <span class="text-sm font-black text-white truncate w-full">${p.name}</span>
                            <span class="px-2 py-0.5 mt-0.5 rounded text-[10px] font-black text-black ${raceClass}">${p.race}</span>
                        </div>
                    </div>`;
                });
                html += `</div>`;
            } 
            // 💡 [조건 분기] 선수가 3명 이상일 경우 -> 1번은 대형 카드, 나머지는 하단 썸네일
            else if (playersArr.length > 2) {
                let leadPlayer = playersArr[0] || { name: "미정", race: "미정", img: "" };
                let subPlayers = playersArr.slice(1);
                let leadRaceClass = leadPlayer.race === '프로토스' ? 'race-P' : (leadPlayer.race === '테란' ? 'race-T' : 'race-Z');

                html += `
                <div class="relative w-full h-[140px] bg-[#141518] border border-[#2c2d33] rounded-xl overflow-hidden flex ${isRightSide ? 'flex-row-reverse' : 'flex-row'} items-center p-3 gap-4">
                    <img src="${leadPlayer.img}" class="w-24 h-full object-cover rounded-lg border border-[#2c2d33] shrink-0 bg-black/40" onerror="this.src='https://placehold.co/120x160/1b1c20/FFF?text=User'">
                    <div class="flex flex-col justify-center ${isRightSide ? 'items-end text-right' : 'items-start text-left'} flex-1 truncate">
                        <span class="text-lg font-black text-white truncate w-full" style="text-shadow: 1px 1px 3px black;">${leadPlayer.name}</span>
                        <span class="px-2 py-0.5 mt-1 rounded text-xs font-black text-black ${leadRaceClass}">${leadPlayer.race}</span>
                    </div>
                </div>`;

                html += `<div class="flex gap-2 w-full justify-start mt-0.5">`;
                subPlayers.forEach(p => {
                    let subRaceClass = p.race === '프로토스' ? 'race-P' : (p.race === '테란' ? 'race-T' : 'race-Z');
                    html += `
                    <div class="flex-1 flex items-center gap-2 bg-[#141518] border border-[#2c2d33] rounded-lg p-1.5 overflow-hidden">
                        <img src="${p.img}" class="w-8 h-8 object-cover rounded border border-[#2c2d33] shrink-0 bg-black/40" onerror="this.src='https://placehold.co/60x60/1b1c20/FFF?text=User'">
                        <div class="flex flex-col truncate">
                            <span class="text-xs font-bold text-white truncate">${p.name}</span>
                            <span class="px-1 rounded text-[8px] font-black text-black ${subRaceClass} w-max mt-0.5">${p.race}</span>
                        </div>
                    </div>`;
                });
                html += `</div>`;
            } 
            // 💡 [기본] 1명일 경우 (1v1 개인전) -> 꽉 찬 대형 카드 1개 출력
            else {
                let p = playersArr[0] || { name: "미정", race: "미정", img: "" };
                let raceClass = p.race === '프로토스' ? 'race-P' : (p.race === '테란' ? 'race-T' : 'race-Z');
                html += `
                <div class="relative w-full h-[180px] bg-[#141518] border border-[#2c2d33] rounded-xl overflow-hidden flex ${isRightSide ? 'flex-row-reverse' : 'flex-row'} items-center p-3 gap-4">
                    <img src="${p.img}" class="w-28 h-full object-cover rounded-lg border border-[#2c2d33] shrink-0 bg-black/40" onerror="this.src='https://placehold.co/120x160/1b1c20/FFF?text=User'">
                    <div class="flex flex-col justify-center ${isRightSide ? 'items-end text-right' : 'items-start text-left'} flex-1 truncate">
                        <span class="text-xl font-black text-white truncate w-full" style="text-shadow: 1px 1px 3px black;">${p.name}</span>
                        <span class="px-2.5 py-0.5 mt-1 rounded text-xs font-black text-black ${raceClass}">${p.race}</span>
                    </div>
                </div>`;
            }

            html += `</div>`;
            return html;
        }

        function triggerFadeAnimation() {
            let container = document.getElementById('vs-wrapper');
            if (!container) return;

            if (fadeTimer) clearTimeout(fadeTimer);

            container.classList.remove('active');
            void container.offsetWidth; 

            container.classList.add('active');

            fadeTimer = setTimeout(() => {
                container.classList.remove('active');
            }, 6000);
        }
    </script>
</head>
<body class="flex items-center justify-center h-screen p-6">
    <div id="vs-wrapper-outer" style="transition: opacity 0.3s ease;">
        <div id="vs-wrapper" class="flex items-center justify-center gap-4 bg-[#141518]/95 border border-[#2c2d33] rounded-2xl p-6 shadow-2xl backdrop-blur-md w-[960px]">
            <div id="t1-container"></div>
            <div class="flex flex-col items-center justify-center px-2 shrink-0">
                <span class="text-3xl font-black italic text-[#00FFA3] tracking-widest mb-3 drop-shadow-[0_0_10px_rgba(0,255,163,0.5)]">VS</span>
                <div class="flex flex-col items-center bg-[#0b0c0e] border border-[#2c2d33] p-2 rounded-xl">
                    <img id="map-img" src="https://placehold.co/60x60/1b1c20/FFF?text=Map" class="w-12 h-12 object-cover rounded-lg border border-[#2c2d33] mb-1">
                    <span id="map-name" class="text-xs font-bold text-gray-300 truncate max-w-[100px]">맵 이름</span>
                </div>
            </div>
            <div id="t2-container"></div>
        </div>
    </div>
</body>
</html>
