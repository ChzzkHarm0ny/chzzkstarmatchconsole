<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CHZZK VS Matchup Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: rgba(0, 0, 0, 0); margin: 0; overflow: hidden; }
        .race-P { background-color: #FFE000; color: #000; }
        .race-T { background-color: #00AFFF; color: #000; }
        .race-Z { background-color: #FF4545; color: #fff; }
        
        #vs-wrapper {
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        #vs-wrapper.active {
            opacity: 1;
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkFwwmrV9iFp3XnS3h2Oa0FI-T-3WbxPA",
            authDomain: "starcraft-console.firebaseapp.com",
            databaseURL: "https://starcraft-console-default-rtdb.firebaseio.com",
            projectId: "starcraft-console",
            storageBucket: "starcraft-console.firebasestorage.app",
            messagingSenderId: "928203238966",
            appId: "1:928203238966:web:4c5333274ffb3255ff3297",
            measurementId: "G-8KXBQ9J2MT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let fadeTimer = null;
        let lastVsDataStr = "";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');

            if (!roomId) {
                document.body.innerHTML = "<div style='color:white; padding:20px;'>방(room) 정보가 지정되지 않았습니다.</div>";
                return;
            }

            const roomRef = ref(db, `rooms/${roomId}`);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val() || {};
                let ms = data.matchState || {};

                let wrapperEl = document.getElementById('vs-wrapper-outer');
                if (ms.vsVisible === false) {
                    wrapperEl.style.opacity = '0';
                    wrapperEl.style.pointerEvents = 'none';
                    return;
                } else {
                    wrapperEl.style.opacity = '1';
                    wrapperEl.style.pointerEvents = 'auto';
                }

                let vs = ms.vsMatch;
                let teamNames = ms.teamNames || { team1: "1팀", team2: "2팀", team1Color: "#1d3557", team2Color: "#6a1b1b" };

                if (vs) {
                    let currentVsStr = JSON.stringify(vs);

                    document.getElementById('p1-name').innerText = vs.t1?.name || "선수1";
                    document.getElementById('p2-name').innerText = vs.t2?.name || "선수2";
                    
                    document.getElementById('p1-img').src = vs.t1?.img || `https://raw.githubusercontent.com/ChzzkHarm0ny/SZD/main/images/${encodeURIComponent(vs.t1?.name)}.png`;
                    document.getElementById('p2-img').src = vs.t2?.img || `https://raw.githubusercontent.com/ChzzkHarm0ny/SZD/main/images/${encodeURIComponent(vs.t2?.name)}.png`;
                    
                    let p1Race = vs.t1?.race || "미정";
                    let p2Race = vs.t2?.race || "미정";
                    let p1RaceEl = document.getElementById('p1-race');
                    let p2RaceEl = document.getElementById('p2-race');

                    p1RaceEl.innerText = p1Race;
                    p1RaceEl.className = `px-2 py-0.5 rounded text-xs font-black text-black ${p1Race==='프로토스'?'race-P':(p1Race==='테란'?'race-T':'race-Z')}`;
                    
                    p2RaceEl.innerText = p2Race;
                    p2RaceEl.className = `px-2 py-0.5 rounded text-xs font-black text-black ${p2Race==='프로토스'?'race-P':(p2Race==='테란'?'race-T':'race-Z')}`;

                    document.getElementById('p1-team').innerText = teamNames.team1;
                    document.getElementById('p1-team').style.backgroundColor = teamNames.team1Color;
                    document.getElementById('p2-team').innerText = teamNames.team2;
                    document.getElementById('p2-team').style.backgroundColor = teamNames.team2Color;

                    if(vs.map) {
                        document.getElementById('map-name').innerText = vs.map.name || "맵 이름";
                        if(vs.map.url) {
                            document.getElementById('map-img').src = vs.map.url;
                        }
                    }

                    // 데이터가 새로 송출될 때만 페이드 애니메이션 재실행
                    if (currentVsStr !== lastVsDataStr) {
                        lastVsDataStr = currentVsStr;
                        triggerFadeAnimation();
                    }
                }
            });
        };

        function triggerFadeAnimation() {
            let container = document.getElementById('vs-wrapper');
            container.classList.add('active');

            if (fadeTimer) clearTimeout(fadeTimer);

            fadeTimer = setTimeout(() => {
                container.classList.remove('active');
            }, 6000);
        }
    </script>
</head>
<body class="flex items-center justify-center h-screen p-6">
    <div id="vs-wrapper-outer" style="transition: opacity 0.3s ease;">
        <div id="vs-wrapper" class="flex items-center justify-between bg-[#141518]/95 border border-[#2c2d33] rounded-2xl p-6 shadow-2xl backdrop-blur-md w-[850px]">
            
            <div class="flex items-center gap-5 bg-[#0b0c0e] border border-[#2c2d33] rounded-xl p-4 w-[360px]">
                <img id="p1-img" src="https://placehold.co/120x120/1b1c20/FFF?text=P1" class="w-24 h-24 object-cover rounded-xl border border-[#2c2d33] shrink-0" onerror="this.src='https://placehold.co/120x120/1b1c20/FFF?text=User'">
                <div class="flex flex-col items-start">
                    <span id="p1-team" class="px-2 py-0.5 rounded text-[10px] font-black text-white mb-1 shadow">1팀</span>
                    <span id="p1-name" class="text-xl font-black text-white tracking-wider mb-2 truncate max-w-[200px]">선수1</span>
                    <span id="p1-race" class="px-2 py-0.5 rounded text-xs font-black text-black">종족</span>
                </div>
            </div>

            <div class="flex flex-col items-center justify-center px-4">
                <span class="text-2xl font-black italic text-[#00FFA3] tracking-widest mb-3 drop-shadow-[0_0_10px_rgba(0,255,163,0.5)]">VS</span>
                <div class="flex flex-col items-center bg-[#0b0c0e] border border-[#2c2d33] p-2 rounded-xl">
                    <img id="map-img" src="https://placehold.co/60x60/1b1c20/FFF?text=Map" class="w-10 h-10 object-cover rounded-lg border border-[#2c2d33] mb-1" onerror="this.src='https://placehold.co/60x60/1b1c20/FFF?text=Map'">
                    <span id="map-name" class="text-[11px] font-bold text-gray-300 truncate max-w-[100px]">맵 이름</span>
                </div>
            </div>

            <div class="flex items-center justify-end gap-5 bg-[#0b0c0e] border border-[#2c2d33] rounded-xl p-4 w-[360px]">
                <div class="flex flex-col items-end">
                    <span id="p2-team" class="px-2 py-0.5 rounded text-[10px] font-black text-white mb-1 shadow">2팀</span>
                    <span id="p2-name" class="text-xl font-black text-white tracking-wider mb-2 truncate max-w-[200px]">선수2</span>
                    <span id="p2-race" class="px-2 py-0.5 rounded text-xs font-black text-black">종족</span>
                </div>
                <img id="p2-img" src="https://placehold.co/120x120/1b1c20/FFF?text=P2" class="w-24 h-24 object-cover rounded-xl border border-[#2c2d33] shrink-0" onerror="this.src='https://placehold.co/120x120/1b1c20/FFF?text=User'">
            </div>

        </div>
    </div>
</body>
</html>
